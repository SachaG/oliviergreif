titre:
  fr: Cinquante doigts
date: 2023-09-19
texte:
  fr: |-
    <p>Après un concert Greif en compagnie de la violoncelliste Emmanuelle Bertrand au festival Musica de Strasbourg, le pianiste Pascal Amoyel donne son formidable spectacle <a href="https://www.theatremontparnasse.com/le-pianiste-aux-50-doigts/">Le pianiste aux cinquante doigts</a> au Théâtre Montparnasse, 31 rue de la Gaîté, 75014 Paris, du 28 septembre au 31 décembre. </p>
    <p>Il y parle de son maître Geörgy Cziffra et joue des œuvres de Liszt, Schumann, Chopin, Katchaturian, Gerschwin, Duke Ellington, Amoyel, ainsi que Le Carillon de Chérence, dernier mouvement de la sonate <em>Les plaisirs de Chérence</em>, d’Olivier Greif.</p>
