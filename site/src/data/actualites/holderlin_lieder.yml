titre:
  fr: Hölderlin Lieder
date: 2017-05-06
texte:
  fr: <p>Journal d’Olivier, 9 mai 94<br />Je me suis rejoué ce matin, un peu par hasard - ils dormaient dans un tiroir depuis presque un an -, mes Lieder sur Hölderlin. Je dois avouer que j'ai été fort impressionné - bouleversé, même - par la force et par la beauté de cette pièce.<br />Une chose me frappe. C'est qu'ici la musique ne fait pas qu'accompagner, commenter le texte - ce qu'elle fait plutôt bien, d'ailleurs, selon moi - mais elle incarne une sorte de plongée spéléologique dans la personne même d'Hölderlin, sa vie, son œuvre, sa « folie », son isolement extrême. (...) Les premiers lieder du cycle sont sur Hölderlin, sur ses poèmes, mais ceux qui suivent sont Hölderlin lui-même. <br /><em>Création de l’œuvre le 13 mai 2017.</em></p>
