titre:
  fr: Concert reporté
date: 2015-11-24
texte:
  fr: "<p> Le quatuor n°4 “Ulysses” devait être donné le 15 novembre à la Synagogue Copernic. Ce concert a dû être annulé en raison des attentats du 13 novembre. Il est reporté au mercredi 17 février 2016 à 20h00.Les personnes ayant réservé des places pour le 15 novembre 2015 peuvent conserver leurs billets, qui seront valables le 17 février 2016, ou obtenir le remboursement auprès de l'ULIF : 01 47 04 37 27.</p>"
