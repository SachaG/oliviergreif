titre:
  fr: Quinze ans
date: 2015-03-18
texte:
  fr: '<p>Olivier Greif est mort en mai 2000. À l’occasion du quinzième anniversaire de sa disparition, et pour marquer l’intérêt que des jeunes interprètes portent à sa musique, l’association Olivier Greif organise un concert de ses œuvres le 21 mai au CRR de la rue de Madrid. Voir ci-contre.<br />Réservation conseillée: , 06 03 35 93 53.<br />Le 13 mai, rediffusion du concert <em>Hommage à Olivier Greif</em> sur Mezzo SD à 11h15.<br />Le 15 mai, dans le cadre du festival de La Prée, la <em>Symphonie</em> sera donnée dans l’église de Châteauneuf-sur-Cher dans sa version pour chant et orgue.<br />Promotion spéciale sur le coffret de douze DVD Olivier Greif : 50 euros au lieu de 100. Voir <a href="http://www.abbreportages.com" >www.abbreportages.com</a>.</p>'
