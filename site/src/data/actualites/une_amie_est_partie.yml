titre:
  fr: Une amie est partie
date: 2010-11-20
texte:
  fr: "<p>Mildred Clary, qui nous a quittés le 18 novembre, était une amie proche d’Olivier et un membre éminent de l’association Olivier Greif.<br />Elle avait contribué à la réalisation du disque de l’INA “Olivier Greif, le Rêve du Monde”, qui a reçu le Diapason d’or de l’année dans la catégorie “Archives”.<br />Voici une phrase extraite du journal d’Olivier (23 avril 1999): “Merveilleuse Mildred, dont la foi en la qualité de mon travail me touche tant! Il est peu de personnes dans le milieu musical qui, non seulement aiment et défendent autant ma musique, mais aussi la comprennent si bien de l’intérieur.”</p>"
