titre:
  fr: Concours de Lyon
date: 2011-05-02
texte:
  fr: <p>Le 7ème concours international de musique de chambre de Lyon s’est   déroulé  du 18 au 22 avril 2011. Les candidats admis en demi-finale   devaient jouer  les 3ème et 4ème mouvements du Trio d’Olivier Greif.  Le  trio Van Baerle  (Pays-Bas) a remporté le premier prix, ainsi que le  prix décerné par la  Sacem pour la meilleure  interprétation du trio de  Greif (à l’unanimité  du jury) et le prix du public. <br />Par ailleurs,  le département Musique et Musicologie de l’université Lumière-Lyon 2  vient de publier, sous la direction de Gérard Streletski, les actes de  4ème concours, consacré aux duos violon piano. Le livre contient une  belle contribution de Brigitte François-Sappey sur la sonate Meeting of  the Waters et les autres œuvres pour violon et piano d’Olivier Greif.<br />PS.  Certains e-mails  récents ont  disparu mystérieusement. Si vous nous  avez écrit en février  ou mars 2011  et n’avez pas reçu de réponse,  veuillez nous renvoyer  votre e-mai</p>
