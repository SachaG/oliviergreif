titre:
  fr: Danse des Araucans
date: 2017-09-05
texte:
  fr: '<p>L’ensemble Olivier Greif de Groningen projette d’enregistrer un CD d’œuvres de jeunesse d’Olivier. On peut voir et entendre sur YouTube l’une de ces œuvres, la <em>Danse des Araucans</em> op. 89 pour deux pianos et percussions, composée en 1977 et dédiée à Michel Tournier: <a href="https://www.youtube.com/watch?v=J_Y2tDQnatc" title="Danse des Araucans" >https://www.youtube.com/watch?v=J_Y2tDQnatc</a><br />Les Araucans sont des Indiens du Chili.<br />On peut s’abonner à la chaîne de l’ensemble Olivier Greif sur YouTube, ce qui permet d’être averti quand une nouvelle vidéo est mise en ligne. Dix vidéos sont proposées actuellement. <br />Quand on demande “Olivier Greif” à YouTube, le programme annonce <em>environ 1900 résultats</em>. De nombreuses vidéos n’ont pas de rapport évident avec Olivier, mais on peut tout de même voir et entendre une quinzaine d’œuvres intégrales (dont trois versions différentes du Trio), ainsi que des centaines d’extraits, des entretiens avec Olivier ou avec ses proches, etc.</p>'
