titre:
  fr: Année anniversaire
date: 2010-01-31
texte:
  fr: <p>Plus de vingt concerts sont déjà annoncés pour célébrer le dixième anniversaire de la mort d’Olivier. Quatre disques sont enregistrés ou en cours d'enregistrement. Des conférences et des émissions de radio auront lieu. Un film sera montré à La Prée et sur Mezzo. Olivier aurait eu soixante ans le 3 janvier 2010.</p>
