titre:
  fr: Olivier en ligne
date: 2020-03-27
texte:
  fr: '<p>Comme on peut le voir ci-contre, les concerts du printemps ont été supprimés pour cause de confinement et, espérons-le, reportés – peut-être à la Toussaint pour Deauville. On peut se consoler en écoutant, et en regardant parfois, Olivier sur internet. La rubrique <em>Liens</em> de ce site propose des liens directs vers les principales plateformes de Streaming et de vente: Youtube, Spotify, Deezer, Qobuz. On trouve aussi la musique d’Olivier sur Amazon music, Apple music, etc.<br />De nouvelles séquences d’entretiens avec Olivier ont été mises en ligne récemment sur Youtube: <br /><a href="https://www.youtube.com/watch?v=P9M5qt6_hd4&feature=youtu.be" >https://www.youtube.com/watch?v=P9M5qt6_hd4&feature=youtu.be<br /></a><a href="https://www.youtube.com/watch?v=BWYhcS0tSqk&feature=youtu.be" >https://www.youtube.com/watch?v=BWYhcS0tSqk&feature=youtu.be<br /></a><a href="https://www.youtube.com/watch?v=cdqCq84mJ3g" >https://www.youtube.com/watch?v=cdqCq84mJ3g</a></p>'
