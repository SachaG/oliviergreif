titre:
  fr: Concours d’Orléans
date: 2011-11-14
texte:
  fr: "<p>Le concours de piano d’Orléans, qui se déroule du 23 février au 4 mars,  comporte un prix Olivier Greif. Les partitions éditées, le rondo 42nd  Street et la sonate n°20, peuvent être achetés dans les librairies  musicales ou sur internet. L’association Olivier Greif peut envoyer les  fichiers PDF de cinq Sonates gravées et corrigées: n°12, 14, 15, 21 et 22.  Les gravures de certaines autres partitions sont en cours. Nous  consulter.<br />Scores by Olivier Greif available for the Orléans piano  competition. The 42nd Street rondo and 20th sonata have been published  and can be purchased online. Sonatas #12, 14, 15, 21 and 22 have been  engraved and are sent as PDF by Association Olivier Greif. Other scores  are being engraved. If you are interested in a specific score, please  send us its opus number and we’ll tell you whether it is available.</p>"
