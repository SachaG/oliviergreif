titre:
  fr: Retour chez Salabert
date: 2009-03-04
texte:
  fr: "<p>L’éditeur Salabert, qui appartient au groupe Universal, a déjà publié deux œuvres d’Olivier Greif: Les Lettres de Westerbork (en 1993) et Le Livre des Saints Irlandais (en 1998). Deux nouvelles publications sont prévues chez Salabert en 2009: le Concerto pour Violoncelle “Durch Adams Fall” et le Quadruple Concerto “La Danse des Morts”.</p>"
