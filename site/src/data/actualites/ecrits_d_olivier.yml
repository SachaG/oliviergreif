titre:
  fr: Écrits d’Olivier
date: 2016-07-04
texte:
  fr: "<p>Divers extraits du journal d’Olivier Greif ont été incorporés à ce site.<br />1) Les présentations des œuvres données en concert et les commentaires sur ses œuvres rédigés dans son journal (en général, dans sa correspondance). Ces textes apparaissent dans les fiches des œuvres (rubrique <em>Catalogue</em>).<br />2) Divers textes consacrés à des compositeurs (dont un long texte sur Schubert écrit pour préparer une conférence), ainsi que des considérations sur la musique. Ces textes sont regroupés en un article intitulé <em>Écrits sur la musique et les musiciens</em>que l'on peut télécharger dans la rubrique <em>Liens</em>.<br />La rubrique <em>Liens</em> s’enrichit par ailleurs d’un accès à une fiche Olivier Greif très complète sur la base de données B.R.A.H.M.S de l’Ircam: <a href=\"http://brahms.ircam.fr/olivier-greif\" title=\"brahms.ircam.fr/olivier-greif\">brahms.ircam.fr/olivier-greif</a></p> </p>"
