titre:
  fr: Olivier online
date: 2013-11-05
texte:
  fr: <p>Il est de plus en plus facile de découvrir la musique d’Olivier Greif sur internet. YouTube propose plusieurs dizaines de séquences son ou vidéo, du pionnier Henri Barda jouant la Sonate dans le goût ancien à Tokyo, présent sur YouTube depuis cinq ans, à de nombreux extraits (musique et interviews) des douze DVD de ABB productions. On peut écouter intégralement le Trio (enregistrement Harmonia Mundi), le Tombeau de Ravel (ABB), Cinq chansons enfantines et Quatre poèmes de Prévert (Loiseleur des Longchamps), diverses pièces de jeunesse inédites pour piano (Nicolas Horvath). Lucas Perus, un jeune pianiste (et patineur) de Montréal joue 42nd Street. Les autres séquences sont des mouvements isolés des sonates pour piano et violon/piano et des quatuors.<br />Spotify et Deezer diffusent uniquement des œuvres complètes. Des deux côtés, on trouve les disques Harmonia Mundi et Universal que l’on peut écouter intégralement. Deezer permet aussi d'écouter le disque Saphir Productions et le double disque INA. La diffusion est gratuite, mais des publicités irritantes se glissent entre les mouvements. Un abonnement mensuel de cinq ou dix euros élimine les publicités. On accède ainsi à une discothèque à peu près infinie.</p>
