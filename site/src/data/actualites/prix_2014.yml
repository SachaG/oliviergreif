titre:
  fr: Prix
date: 2014-07-04
texte:
  fr: <p>Le onzième Concours International de Piano d’Orléans s’est déroulé du 5 au 15 mars.<br />Le  prix Olivier Greif a été décerné à deux pianistes, Le Liu et Aline  Piboule. Toutes les deux ont joué le premier mouvement de la Sonate de  guerre.<br />Le Liu a étudié à Shanghai et à Vienne, où elle réside actuellement. Voir <a href="http://www.leliu-pianist.net/acticle4.html">http://www.leliu-pianist.net/acticle4.html</a><br />Aline Piboule a étudié aux CNSM de Lyon et de Paris, puis à Montréal. Voir <a href="http://www.alinepiboule.wix.com/piano#">http://www.alinepiboule.wix.com/piano#!<br /></a>Le livre “Olivier Greif, Le Rêve du monde” -   réalisé sous la direction de Brigitte François-Sappey et Jean-Michel Nectoux  (Editions Aedam Musicae) a reçu deux prix. Le 3 avril, Le Prix des Muses Singer-Polignac dans la  catégorie Témoignages. Le 16 juin, le “Prix de la monographie” décerné par le Syndicat Professionnel de la Critique Théâtre Musique et danse pour l’année 2013/2014.<br /><a href="http://www.alinepiboule.wix.com/piano#"></a></p>
