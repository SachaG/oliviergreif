titre:
  fr: Œuvre inédite
date: 2016-02-25
texte:
  fr: <p>Comme l’année dernière, l’association Olivier Greif organise un concert commémoratif au mois de mai (voir ci-contre). La version pour orgue et chant de la <em>Symphonie</em> sera donnée pour la première fois à Paris par Loiseleur des Longchamps et Olivier Dekeister, les interprètes qui ont créé l’œuvre à Deauville en 2011. Loiseleur des Longchamps créera <em>Imago Mundi</em>, un cycle de Lieder composé en 1998 sur des poèmes de Dylan Thomas, William Blake, Paul Celan, Walt Whitman et Sylvia Plath. Le concert aura lieu en l’Église Saint-Lambert de Vaugirard, dont Olivier Keister est l’organiste.</p>
