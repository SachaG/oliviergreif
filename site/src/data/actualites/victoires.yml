titre:
  fr: Victoires
date: 2021-02-26
texte:
  fr: "<p>Les Victoires de la musique classiques ont été décernées le 24 février. Trois des lauréates et lauréats sont mentionnés sur ce site. Marie-Laure Garnier, soprano, qui interprète les Chants de l'âme avec le pianiste Philippe Hattat sur le disque paru en 2020 aux éditions B Records, remporte la Victoire 2021 dans la catégorie Révélation, artiste lyrique. Betsy Jolas, qui fait partie du comité de parrainage de l'association Olivier Greif, remporte la Victoire dans la catégorie Compositeur. Le pianiste Alexandre Tharaud, qui a interprété la Sonate dans le goût ancien en juillet 2001 au cours de l'hommage à Olivier Greif au festival de Cordes sur Ciel, remporte la Victoire dans la catégorie Soliste instrumental. L'un des trois nominés dans la catégorie Compositeur, Benoît Menut, est membre du conseil d'administration de l'association Olivier Greif. Il a composé des œuvres en hommage à Olivier et prépare une édition des quatuors.<br />Une autre bonne nouvelle: la page Wikipédia d’Olivier Greif a été rénovée: <br /><a href=\"https://fr.wikipedia.org/wiki/Olivier_Greif\" title=\"https://fr.wikipedia.org/wiki/Olivier_Greif\" >https://fr.wikipedia.org/wiki/Olivier_Greif</a></p>"
