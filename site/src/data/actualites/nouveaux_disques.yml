titre:
  fr: Nouveaux disques
date: 2010-04-14
texte:
  fr: "<p>Deux disques tout neufs.<br />Chez Zig-Zag Territoires: Patrick Langot et Agnès Vesterman, violoncelles, jouent The Battle of Agincourt, puis l'Ensemble Syntonia et la baryton Alain Buet interprètent le quatuor n°2 avec voix sur trois sonnets de Shakespeare.<br />Chez Triton: Stéphanie Moraly, violon, et Romain David, piano, donnent l'intégrale de l’œuvre pour violon et piano, y compris la première sonate, composée en 1967, qui n’a jamais été jouée.</p>"
