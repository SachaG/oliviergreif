titre:
  fr: Dijon on line
date: 2010-09-21
texte:
  fr: "<p>Une journée d’hommage à Olivier Greif a eu lieu à Dijon le samedi 18 septembre. Le programme figure sur le site <a href=\"http://www.selfworld.net/room_events/28\">http://www.selfworld.net/room_events/28</a>. <br />En naviguant à l’intérieur du site, ou en allant directement sur <a href=\"http://www.selfworld.net/event_show/213\">http://www.selfworld.net/event_show/213</a>, on peut assister à plusieurs concerts: sonate pour deux violoncelles, adagio et première sonate violon et piano, trois Chants de l'âme, hommage d'Alexandre Gasparov à Olivier.<br />La liaison prévue avec Los Angeles et New York a mal fonctionné. L’exécution de Ich ruf zu dir par Bill Powell et ses amis a néanmoins remporté un très grand succès sur place (dans  l’auditorium de l’école Cal Arts).</p>"
