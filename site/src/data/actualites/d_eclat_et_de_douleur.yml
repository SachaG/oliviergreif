titre:
  fr: D’éclat et de douleur
date: 2023-03-23
texte:
  fr: |-
    <p><em>Olivier Greif / d’éclat et de douleur</em> est le titre d'un numéro double consacré à Olivier Greif par la revue Euterpe, publiée par Les Amis de la Musique Française.</p> 
    <p>Réalisé sous la direction de Brigitte François-Sappey et Étienne Kippelen avec le soutien de l’association Olivier Greif, cet ouvrage reproduit les contributions de Patricia Aubertin, Félix Bénati, Brigitte François-Sappey, Jean-Jacques Greif, Anne Ibos-Augé, Étienne Kippelen, Sarah Léon, Anne-Elise Thouvenin, Brice Tissier, François-Gildas Tual et Thomas Vernet aux conférences données le 1er octobre 2021 à la bibliothèque musicale La Grange-Fleuret et le 13 octobre suivant au Conservatoire National Supérieur de Musique. </p>
    <p>On peut commander la revue Euterpe auprès des <a href="mailto:joubertjean24@gmail.com" title="amis de la musique française">amis de la musique française</a> et dans les librairies musicales de la rue de Rome à Paris. L’association Olivier Greif a acheté des numéros pour ses membres. Les membres parisiens recevront leur numéro le 12 avril s’ils assistent au concert de la BMLGF. Ils peuvent aussi venir le chercher au siège de l’association (01 48 87 28 27).</p>
