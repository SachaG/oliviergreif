titre:
  fr: Olivier par Olivier
date: 2010-06-29
texte:
  fr: "<p>Le double album “Olivier Greif, le Rêve du Monde”, publié par INA mémoire vive, a obtenu un diapason d’or.<br />Il s’agit d’enregistrements dans lesquels Olivier joue ses propres œuvres, seul ou avec d’autres interprètes.<br />Huit œuvres ont été enregistrées par Radio-France, deux (la sonate pour piano “Le Rêve du Monde” et la sonate pour piano et violon “Meeting of the Waters”) par la Radio Polonaise à Varsovie en 1993.<br />Un enregistrement émouvant, celui d’une “suite pour piano”, date de 1962: Olivier avait douze ans. L’œuvre ne figure pas au catalogue car la partition est perdue.</p>"
