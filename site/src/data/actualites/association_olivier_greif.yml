titre:
  fr: Association Olivier Greif
date: 2009-10-22
texte:
  fr: <p>L’assemblée générale de l’association Olivier Greif s’est tenue le 17 octobre et a élu le conseil d’administration suivant:<br />Gérard Condé (président), Brigitte François-Sappey et Jean-Michel Nectoux (vice-présidents), Patricia Aubertin (secrétaire), Michel Greif (trésorier), Philippe Hersant, Anthony Girard, Benoît Menut, Jean-Jacques Greif.</p>
