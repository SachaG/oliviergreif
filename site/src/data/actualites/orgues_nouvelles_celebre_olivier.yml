titre:
  fr: Orgues Nouvelles célèbre Olivier
date: 2010-03-31
texte:
  fr: <p>Le magazine Orgues Nouvelles consacre un magnifique dossier à Olivier Greif dans son numéro du printemps 2010. <br />Article de Brigitte François-Sappey; témoignages de Jacques Taddei, Gilles Cantagrel, André Thiébault, Pascal Amoyel, Patrick Langot; extrait de la transcription pour orgue de la Symphonie par Olivier Dekeister, organiste de Saint-Lambert de Vaugirard. <br />Le CD propose un Chant de l'Âme, un mouvement du quatuor “Ulysses", la présentation par Olivier de ce quatuor, la lecture par Mildred Clary de sa “Lettre à Olivier”.</p>
