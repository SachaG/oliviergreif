titre:
  fr: Prix
date: 2014-04-06
texte:
  fr: <p>Le Prix des Muses Singer-Polignac récompense des ouvrages consacrés à la musique classique, au jazz et aux musiques traditionnelles (études musicologiques, biographies, romans etc...) publiés en langue française au cours de l'année précédente. Il a été décerné le 3 avril, dans la catégorie Témoignages, au livre “Olivier Greif, Le Rêve du monde” -  sous la direction de Brigitte François-Sappey et Jean-Michel Nectoux (Editions Aedam Musicae). Le jury était présidé par Claude Samuel.<br />Le onzième Concours International de Piano d’Orléans s'est déroulé du 5 au 15 mars.<br />Le prix Olivier Greif a été décerné à deux pianistes, Le Liu et Aline Piboule. Toutes les deux ont joué le premier mouvement de la Sonate de guerre.<br />Le Liu a étudié à Shanghai et à Vienne, où elle réside actuellement. Voir <a href="http://www.leliu-pianist.net/acticle4.html">http://www.leliu-pianist.net/acticle4.html</a><br />Aline Piboule a étudié aux CNSM de Lyon et de Paris, puis à Montréal. Voir <a href="http://www.alinepiboule.wix.com/piano#">http://www.alinepiboule.wix.com/piano#!</a></p>
