titre:
  fr: Fête polonaise sur France Musique
date: 2009-04-12
texte:
  fr: <p>Le 22 décembre 2008, Marc Minkowski et l’orchestre Sinfonia Varsovia ont donné une “fête polonaise” au Châtelet à l’occasion de la fin de la présidence française de l’Union Européenne. Une salle pleine a découvert et applaudi le Quadruple Concerto d’Olivier Greif. France Musique avait annoncé que ce concert serait diffusé le 31 décembre à 22h30, mais la diffusion a été annulée sans explication à la dernière minute. Il ne s’agissait pas d’une annulation définitive, mais d’un report. Le fête polonaise est passée sur France Musique le jeudi 9 avril à 20h. La chaîne ne nous ayant pas avertis, nous n’avons pas pu annoncer la diffusion sur ce site. On pouvait réécouter l’émission pendant vingt-quatre heures. Elle n’est pas proposée en téléchargement.</p>
