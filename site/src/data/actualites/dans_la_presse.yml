titre:
  fr: Dans la presse
date: 2010-05-20
texte:
  fr: <p>Un dossier de six pages dans Diapason en mai. “Olivier Greif, génie du XXème siècle”, dit la couverture. Quatre belles pages dans Orgues Nouvelles printemps 2010. Une page et “choc Classica” pour le disque de Henri Demarquette dans Classica en mai. Une demi-page dans La lettre du musicien en avril.<br />Le disque de l’intégrale violon et piano par Moraly et David recueille cinq diapasons. De même le disque Shakespeare et Agincourt.<br />Une demi-page sympathique dans L’Express du 26 mai. Voir aussi lexpress.fr.</p>
