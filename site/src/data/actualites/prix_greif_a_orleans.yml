titre:
  fr: Prix Greif à Orléans
date: 2014-03-22
texte:
  fr: <p>Le onzième Concours International de Piano d’Orléans s’est déroulé du 5 au 15 mars.<br />Le prix Olivier Greif a été décerné à deux pianistes, Le Liu et Aline Piboule. Toutes les deux ont joué le premier mouvement de la Sonate de guerre.<br />Le Liu a étudié au conservatoire de Shanghai, puis à Eisenstadt et à Vienne, où elle réside actuellement. Elle a obtenu le Grand Prix de la Ville de Paris au concours Olivier Messiaen 2007. Voir <a href="http://www.leliu-pianist.net/acticle4.html">http://www.leliu-pianist.net/acticle4.html</a><br />Aline Piboule a étudié aux CNSM de Lyon et de Paris, puis à Montréal. Elle est lauréate du Concours International de la Ville de Padoue. Voir <a href="http://www.alinepiboule.wix.com/piano#">http://www.alinepiboule.wix.com/piano#!</a></p>
