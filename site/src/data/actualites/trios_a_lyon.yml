titre:
  fr: Trios à Lyon
date: 2011-04-24
texte:
  fr: <p>Le 7ème concours international de musique de chambre de Lyon s’est déroulé  du 18 au 22 avril 2011. Les candidats admis en demi-finale devaient jouer  les 3ème et 4ème mouvements du Trio d’Olivier Greif. Vingt-six trios ont étudié la partition. <br />Le trio Van Baerle (Pays-Bas) a remporté le premier prix, ainsi que le prix décerné par la Sacem pour la meilleure  interprétation du trio de Greif (à l’unanimité du jury), le prix du public et le “Coup de cœur Bayer”. Le prix a été remis le 22 avril par Frédéric Lodéon, qui a parlé de manière émouvante d’Olivier, avec lequel il a créé la première version de la Sonate de Requiem en 1979. Le trio Van Baerle a commencé le concert des lauréats par les deux mouvements du trio d‘Olivier. Le public a longuement applaudi à la fois l’œuvre et les interprètes.<br />PS. Certains e-mails récents ont  disparu mystérieusement. Si vous nous avez écrit en février ou mars 2011  et n’avez pas reçu de réponse, veuillez nous renvoyer votre e-mail.</p>
