titre:
  fr: Agincourt online
date: 2020-09-13
texte:
  fr: <p>Le “concert à la maison” du 29 août en Allemagne a été donné devant un public très restreint, car il était destiné à une diffusion online. Valentin Scharff, créateur de la version pour deux violoncelles de la <em>Sonate d’Agincourt</em> avec Emma Savouret en 1998 à Freiburg im Brisgau, a joué l’œuvre avec son épouse, Daniela Shemer, en deuxième partie d’un concert comportant des duos de Jean-Baptiste Barrière, David Popper et Paganini. Le lien You Tube ci-dessous mène à la présentation de la soirée (en allemand) par ses organisateurs, Esther et Ralf Groh. La sonate commence à 43 minutes et 18 secondes. <br /><a href="https://www.youtube.com/watch?v=mXei5HV5g48&feature=youtu.be">https://www.youtube.com/watch?v=mXei5HV5g48&feature=youtu.be<br /></a>Pour en savoir plus sur les concerts à la maison, les interprètes, les autres compositeurs:<br /><a href="https://www.hauskonzert-feldberg.de/">https://www.hauskonzert-feldberg.de/<br /></a></p>
