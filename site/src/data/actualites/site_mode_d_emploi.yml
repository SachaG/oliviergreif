titre:
  fr: Site mode d’emploi
date: 2009-04-17
texte:
  fr: <p>Le calendrier des concerts affiché sur cette page d’accueil se limite au passé et à l’avenir immédiats. Pour un calendrier complet de 1957 à 2057, cliquez sur “Concerts” en haut de cette page. <br />Le catalogue qui s’affiche si vous cliquez sur “Catalogue” donne la liste des œuvres. Cliquez sur le titre d’une œuvre pour accéder à une fiche détaillée. <br />Un lien sur la page “Biographie” donne accès à une biographie en anglais.</p>
