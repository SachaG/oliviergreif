titre:
  fr: Journées Olivier Greif
date: 2021-10-26
texte:
  fr: |-
    <p>Trois journées de colloques et de concerts prévues en 2020 ont eu lieu en octobre 2021.</p>
    <p>Le 1er octobre, les conférences suivantes ont été données à la bibliothèque La Grange/Fleuret (ex-Médiathèque Musicale Gustave Mahler), à l’occasion du transfert du Fonds Olivier Greif à la bibliothèque:</p>
    <ul> <li>Brigitte François-Sappey: Olivier Greif, “l'éclat, la douleur et le nom”.</li> <li>Sarah Léon: Olivier Greif et la postmodernité.</li> <li>Anne Ibos-Augé: Olivier /Haridas Greif, de la spiritualité avant toute chose. Étienne Kippelen: La chanson dans l’œuvre d'Olivier Greif. </li> <li>Brice Tissier: <em>Durch Adams Fall</em>, du Concerto pour violoncelle d'Olivier Greif à  <em>Nostalgia</em>  de Philippe Hersant.</li> <li>Benoît Menut: Olivier Greif, une écriture des obsessions.</li> <li>Jean-Jacques Greif, Patricia Aubertin, Thomas Vernet (directeur de la bibliothèque), Anne-Élise Thouvenin: Les archives d'Olivier Greif – transmission à la Bibliothèque La Grange/Fleuret.</li> </ul>
    <p>Marie-Laure Garnier, soprano, et Philippe Hattat, piano, ont inteprété les <em>Chants de l’âme</em>.</p>
    <p>Le 2 octobre, la création parisienne du Quintette d’Olivier s'est déroulée au CRR de la rue de Madrid, où des tableaux d’Étienne Yver inspirés par les œuvres d’Olivier étaient exposées. Le Quintette n’avait pas été donné depuis 1996.</p>
    <p>Le 14 octobre, le Conservatoire National Supérieur de Musique et de danse de Paris honorait Olivier. Les conférences suivantes ont été données:</p>
    <ul> <li>Brigitte François-Sappey: Olivier Greif – un parcours singulier enraciné au Conservatoire de Paris.</li>  <li>François-Gildas Tual: Olivier Greif – par “envide” et “génie” de l'enfance. </li> <li>Jean-François Heisser: Olivier Greif, pianiste et compositeur précoce (d’après des enregistrements inédits). </li> <li>Félix Bénati: <em>Requiem pour double chœur a cappella</em> d’Olivier Greif.</li>  <li>Sarah Léon: <em>Ich ruf zu dir </em>d'Olivier Greif –une esthétique du tragique<em>. </em></li> </ul>
    <p>Une table ronde menée par Brigitte François-Sappey a réuni   Marc Minkowski, Philippe Hersant, Nicolas Bacri, Alexis Galpérine. Des élèves, anciens élèves et professeurs du Conservatoire ont joué des extraits d’œuvres d’Olivier. </p>
