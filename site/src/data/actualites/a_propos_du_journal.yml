titre:
  fr: À propos du Journal
date: 2019-09-11
texte:
  fr: |-
    <p>Après la publication du Journal d’Olivier Greif par les éditions Aedam Musicae (voir <a href="http://www.musicae.fr/livre-Olivier-Greif---Journal-Edite-par-Jean-Jacques-Greif-185-84.html" >http://www.musicae.fr/livre-Olivier-Greif—-Journal-Edite-par-Jean-Jacques-Greif-185-84.html</a> ) Anne Ibos-Augé, musicologue, chercheuse à l'Institut de Recherche en Musicologie, a écrit deux articles dans la revue culinaire et musicale <em>Le ventre et l’oreille</em>:</p> <ul> <li><a href="http://leventreetloreille.com/journal-dolivier-greif/">http://leventreetloreille.com/journal-dolivier-greif/</a></li> <li><a href="http://leventreetloreille.com/olivier-greif-le-reve-du-monde-de-brigitte-francois-sappey-et-jean-michel-nectoux-dir/"  >http://leventreetloreille.com/olivier-greif-le-reve-du-monde-de-brigitte-francois-sappey-et-jean-michel-nectoux-dir/</a></li></ul>
     <p>Cette revue avait déjà publié un article de Robin Girard:<br/>
     <a href="http://leventreetloreille.com/olivier-greif-et-la-nouveaute/" >http://leventreetloreille.com/olivier-greif-et-la-nouveaute/</a></p>
     <p>Un autre article paru récemment:<br /><a href="http://www.concertonet.com/scripts/cd.php?ID_cd=4333" >http://www.concertonet.com/scripts/cd.php?ID_cd=4333</a></p>
