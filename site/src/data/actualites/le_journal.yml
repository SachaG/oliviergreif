titre:
  fr: Le Journal
date: 2019-03-31
texte:
  fr: <p>Olivier Greif a tenu “une sorte de carnet de bord” du 11 janvier 1971 au  12 mai 2000, veille de sa mort. Il y raconte des événements de sa vie, y  note des réflexions sur la musique et d’autres sujets, y recopie toutes  les lettres qu'il envoie. Les éditions Aedam Musicae viennent de publier un livre  proposant entre le cinquième et le quart du journal. Sa lecture permet de  mieux comprendre l'étrange parcours du compositeur entre musique et  spiritualité, et d'entrevoir les idées qui ont inspiré ses œuvres. Par  ailleurs, c'est souvent très drôle.<a href="http://www.musicae.fr/livre-Olivier-Greif---Journal-Edite-par-Jean-Jacques-Greif-185-84.html" title="Olivier Greif — Journal" ><br />http://www.musicae.fr/livre-Olivier-Greif---Journal-Edite-par-Jean-Jacques-Greif-185-84.html</a></p>
