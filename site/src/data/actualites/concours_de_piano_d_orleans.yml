titre:
  fr: Concours de piano d’Orléans
date: 2012-03-06
texte:
  fr: <p>Le pianiste américain Christopher Guzman a remporté le premier prix du dixième concours international de piano d’Orléans, décerné le 4 mars 2012. <br />Un autre pianiste américain, Andrew Zhou, a remporté le prix Olivier Greif (instauré en collaboration avec l’association Olivier Greif), pour son interprétation de <em>Am Grabe Franz Liszts</em>.<br />Sur une dizaine de candidats ayant étudié des œuvres d’Olivier, seuls Andrew Zhou et une pianiste russe, Ilona Timchenko, sont parvenus en demi-finale et ont effectivement joué du Greif. Ilona Timchenko a joué, très bien, les 4ème et 5ème mouvements de la sonate <em>Plaisirs de Chérence</em>.</p>
