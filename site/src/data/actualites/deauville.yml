titre:
  fr: Deauville
date: 2021-04-19
texte:
  fr: <p> La <em>Symphonie</em> avec baryton et le Quadruple Concerto  <em>La Danse des Morts </em>seront donnés le samedi <br />1er mai à 20h30 dans le cadre du Festival de Pâques de Deauville. <br />Il s’agit d’un concert sans public, comportant aussi des œuvres de Mahler et Schubert, diffusé gratuitement et en direct sur<br /><a href="http://www.facebook.com/musiqueadeauville/" title="facebook.com/musiqueadeauville" >facebook.com/musiqueadeauville/<br /></a>et <a href="https://recithall.com/events/329" title="recithall.com/events/329" >recithall.com<br /></a>La qualité vidéo et audio devrait être meilleure sur RecitHall, et le concert sera suivi d’une rencontre avec les musiciens.<br />B Records enregistrera les œuvres d’Olivier pour une publication dans la collection de CD Deauville Live.</p>
