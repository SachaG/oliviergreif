titre:
  fr: Lancement de l’année Olivier Greif
date: 2009-09-25
texte:
  fr: <p>Les trois premiers concerts de la saison 2009-2010 du Festival Présences, les 18, 19 et 20 septembre à la Maison de Radio France, étaient intitulés “Hommage à Olivier Greif”. Le public est venu au rendez-vous. Le deuxième soir, on a refusé du monde. Les œuvres ont été accueillies avec enthousiasme. Le Tombeau de Ravel, dans sa version originalre à quatre mains, a été bissé. Les interprètes qui découvraient Olivier Greif ont manifesté l’intention d’explorer son œuvre.</p>
