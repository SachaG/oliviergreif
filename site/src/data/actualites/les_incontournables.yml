titre:
  fr: Les incontournables
date: 2013-04-08
texte:
  fr: "<p>ABB Reportages a publié en mai 2013 une série de 12 DVD, intiitulée “Les Incontournables d'Olivier Greif”, comportant entretiens, témoignages et concerts. L’ampleur et la qualité de ce travail lui ont valu un diapason d’or. Le coffret est en vente dans les boutiques Fnac et Harmonia Mundi. On peut aussi acheter les DVD un par un, ou par six au choix. <br />Voir <a href=\"https://www.abbreportages.com\" >www.abbreportages.com</a> <br />Écouter France Musique le 5 juillet de 19h à 20h, Les traverses du temps.<a href=\"https://www.abbreportages.com\" ></a></p> <p>Rappel: Pascal Amoyel donne son spectacle <em>Le pianiste aux 50 doigts</em>,  au  cours  duquel il joue Le carillon de Chérence, au festival de la Vezère à Brive le 7 juillet, puis en Corée, en Haute-Savoie, etc. Il donne <em>Le Block 15</em> avec Emmanuelle Bertrand le 15 juillet en Espagne, le 22 juillet au festival du Tricastin à Saint-Paul Trois Châteaux, etc. Voir<a href=\"http://www.pascal-amoyel.com/fr/news/\"  >http://www.pascal-amoyel.com/fr/news/</a></p>"
