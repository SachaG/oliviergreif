titre:
  fr: Bertrand & Amoyel
date: 2012-06-01
texte:
  fr: <p>Emmanuelle Bertrand (violoncelle) et Pascal Amoyel (piano) aiment beaucoup la musique d’Olivier Greif. Du 3 au 9 mai 2012, ils ont joué <em>Block 15</em>, qui comporte des extraits de la Sonate de Requiem, en Corée. Le 21 mai, ils ont assuré la création de la Sonate de Requiem et de la sonate Plaisirs de Chérence à Londres (où, par ailleurs le Sanctus du Requiem a été chanté à l’occasion du jubilé de la reine). Pascal donnera son spectacle <em>Le pianiste aux 50 doigts</em>, au cours duquel il joue Le carillon de Chérence, le 5 juin à Riom (Puy de Dôme), le 9 juin à Soyons (Ardèche), puis du 7 au 28 juillet à 11h50 au Théâtre des 3 soleils à Avignon, dans le cadre du festival d’Avignon. Auparavant, Pascal et Emmannuelle auront joué <em>Block 15</em> le 2 juillet aux Invalides. <br />Voir <a href="http://www.pascal-amoyel.com" title="pascal-amoyel.com" >pascal-amoyel.com</a></p>
