titre:
  fr: Greif à la radio et au disque
date: 2020-09-30
texte:
  fr: '<p>Le <em>Carrefour de la Création</em>, une série d’émissions consacrées à la musique contemporaine le dimanche soir sur France Musique, a rendu hommage à Olivier le 27 septembre pour le vingtième anniversaire de sa mort. Brigitte François-Sappey a présenté des enregistrements inédits de la <em>Sonate de guerre</em>, de la <em>Petite cantate de chambre</em> et du <em>Quadruple concerto</em>. Alexis Galpérine, Benoît Menut et Patrick Langot ont parlé d’Olivier et de sa musique. <br /><a href="https://www.francemusique.fr/emissions/carrefour-de-la-creation-l-integrale/carrefour-de-la-creation-autour-d-olivier-greif-86926">https://www.francemusique.fr/emissions/carrefour-de-la-creation-l-integrale/carrefour-de-la-creation-autour-d-olivier-greif-86926<br /></a>Une autre heure à la radio avec Brigitte François-Sappey:<br /><a href="https://frequenceprotestante.com/diffusion/la-malle-a-musiques-du-03-10-2020-2/">https://frequenceprotestante.com/diffusion/la-malle-a-musiques-du-03-10-2020-2/<br /></a>Et un disque tout neuf: le Quintette <em>A Tale of the World</em> par le Quintette Syntonia, chez CIAR classics (voir la page Disques sur ce site).</p>'
