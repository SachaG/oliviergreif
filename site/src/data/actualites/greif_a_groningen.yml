titre:
  fr: Greif à Groningen
date: 2014-07-30
texte:
  fr: "<p>Anne-Elise Thouvenin, une violoncelliste française qui étudie la musique à Groningen, en Hollande, vient de consacrer son projet final de Master à l’analyse de la Sonate de Requiem. Elle a reçu une mention Très Bien.<br />À cette occasion, elle a fondé un “ensemble Olivier Greif de Groningen” qui a donné trois concerts (et en donnera beaucoup d’autres, promet-elle). Le 25 juin, la Sonate de Requiem. Le 26, la Bataille d’Agincourt et le Trio. Le 23 juillet, la Sonate de Requiem, les Lettres de Westerbork et le Trio.<br />Des membres de l’association Olivier Greif ont assisté au dernier concert, donné dans le cadre du festival Peter de Grote. Les jeunes interprètes ont joué avec une vigueur et une passion qui nous rappelaient la fougue d’Olivier lui-même. La salle était pleine. Le public, qui n’avait jamais entendu parler d’Olivier, était visiblement bouleversé. Note historique: Peter de Grote, c’est le tsar Pierre le Grand, qui a séjourné en Hollande et a fait bâtir Saint-Pétersbourg sur le modèle des villes hollandaises.</p>"
