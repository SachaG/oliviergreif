titre:
  fr: Greif à Newcastle
date: 2019-02-01
texte:
  fr: "<p>La violoniste Alexandra Raikhlina est née à Moscou, a grandi en Belgique, vit à Newcastle. Elle y a fondé en 2016 le Brundibár Arts Festival. Brundibár est le titre d'un opéra de Hans Kráza donné dans le camp de concentration de Theresienstadt par les enfants déportés.<br />La soirée d'inauguration du festival 2019, le 24 janvier, était consacrée à Olivier Greif, et à l'influence de la Shoah sur les enfants des rescapés des camps.<br />Avant le concert, j'ai parlé un peu du rôle que le séjour d'un an de notre père à Auschwitz a pu jouer dans la vie d'Olivier et dans la mienne. Un Auschwitz symbolique était enfoui tout au fond de nos mémoires. Nous y pensions rarement. Jusqu'au jour où, vers l'âge de quarante ans, nous avons compris chacun de notre côté que c'était une chance de posséder en soi une telle source d'inspiration. J'ai écrit plusieurs romans qui se passent en partie dans le camp. Olivier a mis la Shoah dans sa musique, en particulier dans les trois œuvres interprétées magnifiquement par Alexandra et ses amis à Newcastle: la sonate pour deux violoncelles <em>Battle of Agincourt</em>, les <em>Lettres de Westerbork</em> et le Quatuor n°3 <em>Todesfuge</em>.<br />Jean-Jacques Greif</p>"
