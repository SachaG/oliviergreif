titre:
  fr: Concours d’Orléans
date: 2016-03-19
texte:
  fr: <p>Le pianiste japonais Takuya Otaki, qui étudie la musique contemporaine à Stuttgart, a remporté le premier prix du douzième concours international de piano d’Orléans, ainsi que le prix Olivier Greif. <br />Plusieurs candidats ont joué des mouvements de la <em>Sonate de guerre</em> ou des <em>Portraits et apparitions</em>. <br />Le Coréen Tae Kim est arrivé en demi-finale. Il envisage de jouer des œuvres d’Olivier à Boston, où il réside. <br />Philippe Hattat, qui va créer le cycle de lieder <em>Imago Mundi</em> avec Loiseleur des Longchamps le 18 mai (voir ci-contre), a participé à la finale avec Takuya Otaki et la pianiste arménienne Marianna Abrahamyan.</p>
