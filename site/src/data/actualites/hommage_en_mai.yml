titre:
  fr: Hommage en mai
date: 2016-05-12
texte:
  fr: '<p>Comme l’année dernière, l’association Olivier Greif a organisé un concert en mai en hommage à Olivier, disparu le 13 mai 2000.<br />Le concert a eu lieu en l’église Saint-Lambert de Vaugirard, dont l’organiste titulaire, Olivier Dekeister, a donné – pour la première fois à Paris, avec le baryton Loiseleur des Longchamps – l’adaptation pour orgue et chant qu’il a réalisée de la <em>Symphonie</em> d’Olivier.<br />Loiseleur des Longchamps et le pianiste Philippe Hattat ont assuré la création mondiale partielle du cycle <em>Imago Mundi</em>, composé en 1998. Six des huit Lieder du cycle, sur des poèmes de Dylan Thomas, William Blake, Paul Celan, Walt Whitman, sont déjà gravés et ont été donnés. La gravure des deux derniers Lieder est prévue pour bientôt.<br />Phlippe Hattat a joué une œuvre virtuose et joyeuse composée à New York en 1970, <em>42nd Street</em>.<br />À écouter: <a href="http://www.judaiquesfm.com/emissions/30/presentation.html" title="Brigitte François)Sappey a parlé d’Olivier et présenté le concert le 11 mai sur JudaIques FM.">Le 11 mai, Brigitte François-Sappey parle d’Olivier et présente le concert sur Judaïques FM</a>.</p>'
