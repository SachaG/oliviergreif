titre:
  fr: Diapason en deuil
date: 2014-08-05
texte:
  fr: <p>Nous venons d’apprendre la disparition tragiquement prématurée, le 1er août, de Nicolas Baron (42 ans!). Il n'était pas seulement, au sein de la rédaction de la revue <em>Diapason</em>, le chef de rubrique “actualité” hautement apprécié de tous pour ses qualités de gentillesse et d’humour, mais encore il avait une plume avertie, alerte et sensible qu’il mettait au service de ses prédilections, parmi lesquelles la musique d’Olivier occupait une place très centrale. Il a écrit sur ses compositions, sur nos publications et sur les DVD, des lignes que nous aurions tous aimé signer tant elles témoignaient d’une compréhension profonde et d'une empathie rare.</p>
