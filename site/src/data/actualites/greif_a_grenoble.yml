titre:
  fr: Greif à Grenoble
date: 2018-06-02
texte:
  fr: <p>Le Conservatoire de Grenoble a consacré l’après-midi et la soirée du 3 mai à Olivier Greif, à l’initiative de François-Gildas Tual, professeur d’histoire de la musique et d’analyse.<br />Une  “Rencontre musicale avec  Brigitte François-Sappey” s'est déroulée de  14h30 à 18h. Musicologue, amie proche d’Olivier Greif,  dédicataire des <em>Chants de l'âme</em>,  Brigitte François-Sappey a parlé  de la vie et de l’œuvre d’Olivier  Greif. Des élèves du Conservatoire ont proposé des illustrations   musicales – tirées du <em>Piano Book</em> op. 78 et du cycle de Lieder <em>Wiener Konzert</em> – et donné des exposés sur les <em>Quatre chansons de Prévert</em>, les <em>Lettres de Westerbork</em>, le <em>Requiem</em>, ainsi que “Olivier Greif en ses manuscrits” et “Les harmonies de l’âme”.  <br />À 19h30,  Chrystèle Chovelon et Forence Cioccolani, professeurs au  Conservatoire, ont interprété les <em>Chants de l'âme</em>.<em><br />Les affiches de Grenoble et du Dauphiné</em> ont consacré une belle page à l’événement dans leur numéro du 11 mai (que l’on peut consulter sur internet pour deux euros).</p>
