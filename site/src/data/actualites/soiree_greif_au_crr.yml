titre:
  fr: Soirée Greif au CRR
date: 2015-06-22
texte:
  fr: |-
    <p>Le Conservatoire à Rayonnement Régional de la rue de Madrid a accueilli six interprètes vigoureux et enthousiastes le 21 mai pour une soirée d’hommage à Olivier Greif à l’occasion du quinzième annivesaire de sa disparition. L’ensemble Olivier Greif de Groningen a mis en ligne sur You Tube des enregistrements vidéo du concert. </p>
