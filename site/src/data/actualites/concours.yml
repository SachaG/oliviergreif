titre:
  fr: Concours
date: 2011-03-05
texte:
  fr: <p>Le 7ème concours international de musique de chambre de Lyon se déroule du 18 au 22 avril 2011. Les candidats admis en demi-finale devront jouer les 3ème et 4ème mouvements du Trio d’Olivier Greif. Un prix d’interprétation Sacem de 4500 euros couronnera la meilleure interprétation du Trio. Brigitte François-Sappey et Benoît Menut parleront d’Olivier Greif au cours d’un colloque le 21 avril. Voir <a href="http://www.cimcl.fr">http://www.cimcl.fr</a><br />Le 10ème concours international de piano d’Orléans, qui se déroule du 23 février au 4 mars 2012, comporte un “prix mention spéciale” Olivier Greif. Les candidats peuvent choisir les partitions qu’ils veulent dans le catalogue d’Olivier Greif.<br />PS. Certains e-mails récents ont disparu mystérieusement. Si vous nous avez écrit en février ou mars 2011 et n’avez pas reçu de réponse, veuillez nous renvoyer votre e-mail.</p>
