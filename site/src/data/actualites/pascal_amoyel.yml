titre:
  fr: Pascal Amoyel
date: 2012-09-27
texte:
  fr: <p>Pascal donne son spectacle <em>Le pianiste aux 50 doigts</em>, au  cours duquel il joue Le carillon de Chérence, le 10 Octobre à Franconville (95), le 24 novembre à Gradignan (33), le 15 décembre à Beynes (78), le 19 décembre à Sèvres (92), le 10 janvier 2013 à Saint-Cloud (92), le 26 janvier à Ancenis (44), le 8 février à Boulogne-sur-mer (62), le 12 février à Lillebonne (76), le 10 mars à Aubagne (13), le 24 mars à Unieux (42).<br />Voir <a href="http://www.pascal-amoyel.com" title="pascal-amoyel.com" >pascal-amoyel.com</a></p>
