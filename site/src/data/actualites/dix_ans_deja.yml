titre:
  fr: Dix ans déjà
date: 2009-09-15
texte:
  fr: <p>Olivier Greif est mort le 13 mai 2000. <br />Le festival Présences de Radio France lui rend hommage au cours de sa saison 2010, qui commence le 18 septembre 2009 par trois concerts successifs. <br />Les Rencontres musicales de l'abbaye de La Prée lui consacrent huit concerts différents, du 12 au 15 mai 2010. <br />Plusieurs nouveaux disques sont en préparation.</p>
