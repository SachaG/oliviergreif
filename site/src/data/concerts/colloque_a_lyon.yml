titre:
  fr: Colloque à Lyon
date: 2011-03-03
oeuvres:
  - trio
interpretes:
  fr: "Trio L: Lyuba Zhecheva, piano; Louis-Jean Perreau, violon; Louison Crès, violoncelle."
adresse: CNSM de Lyon
commentaire:
  fr: '<p>Des extraits du Trio ont été joués dans le cadre d’un colloque consacré à “Une musique française après 1945?” <br />Jean-Marc Bardot a donné une conférence intitulée: <span class="texte">“Entre mémoire et cosmopolitisme : un espace de création musicale chez Philippe Hersant, Olivier Greif et Jean-Louis Florentz.”</span></p>'
