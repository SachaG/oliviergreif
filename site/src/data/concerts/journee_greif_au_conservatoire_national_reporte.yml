titre:
  fr: Journée Greif au Conservatoire National/Reporté
date: 2020-12-02
oeuvres:
  - sonate_pour_violon_et_piano_n_3_the_meeting_of_the_waters
  - le_tombeau_de_ravel
  - sonate_de_requiem
  - petite_cantate_de_chambre
interpretes:
  fr: Alexis Galpérine, violon; Paul-Marie Kuzma, violoncelle;  Michel Dayez, Géraldine Dutroncy, Lucas Belkhiri, Ionah Maïatsky, Philippe Hattat, piano.
adresse: Conservatoire National Supérieur de Musique et de Danse de Paris, 209 avenue Jean-Jaurès, 75019 Paris
commentaire:
  fr: <p>Le concert sera précédé d'un colloque, à 14h, réunissant <span>Brigitte François-Sappey (organisatrice de la journée, vice-présidente de l’association Olivier Greif), François-Gildas Tual, Anne-Ibos-Augé, Félix Benati (classe d’Analyse de Claude Ledoux), Sarah Léon (classe d’Analyse de Claude Abromont), Rodolphe Bruneau-Boulmier; et d’une table ronde, à 18h, réunissant </span><span>Marc Minkowski, Nicolas Bacri, Gilles Cantagrel, Alexis Galpérine et peut-être d’autres personnes.<br />Lucas Belkhiri est un élève de Géraldine Dutroncy, Ionah Maïatsky un élève de Marie-Josèphe Jude, Paul-Marie Kuzma un élève de Jérôme Pernoo. Des élèves de la classe d’Anne Le Bozec interpréteront <em>La petite Cantate de Chambre</em> et quelques mélodies avec Philippe Hattat.</span></p>
