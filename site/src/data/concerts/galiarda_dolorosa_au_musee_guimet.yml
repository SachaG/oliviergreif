titre:
  fr: Galiarda Dolorosa au musée Guimet
date: 1981-05-18
oeuvres:
  - variations_on_peter_philips_galiarda_dolorosa
interpretes:
  fr: Alexandre Bellanger, violon et Julia Tamadjieva, piano.
adresse: Musée Guimet, 75016 Paris
commentaire:
  fr: <p>“Les lundis du Musée Guimet.” Une “sonate n°2” pour piano a été jouée le lundi 8 juin par Françoise Thinat. Olivier ayant changé la numérotation et recopié certaines partitions, il est difficile de savoir quelle sonate portait à l’origine le numéro 2. Il pourrait s’agit de la sonate n°6 opus 27.</p>
