titre:
  fr: Sonate de Requiem et Rêve du monde à Fribourg
date: 1993-07-11
oeuvres:
  - sonate_pour_piano_n_20_le_reve_du_monde
  - sonate_de_requiem
interpretes:
  fr: Olivier Greif, pianoChristoph Henkel, violoncelle et Olivier Greif, piano.
adresse: “Chez Bollschweil”, Freiburg im Brisgau
commentaire:
  fr: <p>Concert en privé, au cours duquel les deux œuvres ont été jouées pour la première fois. Leur création publique a eu lieu quelques mois plus tard à Kuhmo (pour la Sonate de Requiem) et Varsovie (pour la sonate “Rêve du Monde”). </p>
