commentaire:
  fr: <p>Selon Bertrand Malmasson, la sonate Battle of Agincourt “est doublement importante pour nous car elle est à la base de<br /> la création de notre ensemble DuoCelli”.<br />Le concert comporte aussi des créations d’Ivan Bellocq “en rapport avec la sonate Battle of Agincourt”.</p>
