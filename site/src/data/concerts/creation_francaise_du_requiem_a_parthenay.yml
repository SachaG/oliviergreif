commentaire:
  fr: |-
    <p>Extraits. Dans le cadre de l’Académie internationale de chant choral Voix du Thouet et du festival de chant choral Vocal Plus Parthenay.<br />
     Même concert le lendemain en l’église Saint-Pierre, 79600 Airvault.<br />
     Le Requiem, dédié à John Poole, a été créé dans sa version intégrale sur la BBC le 3 février 2002.
