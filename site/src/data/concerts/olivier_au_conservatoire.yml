  - le_livre_des_saints_irlandais
  - portraits_et_apparitions
  - le_tombeau_de_ravel
  - trio
interpretes:
  fr: "Michel Dalberto, piano. Thomas Dupont, Hélène Fouquart, Diana Cooper, Eve-Melody Salom, élèves de piano. Nikolaus Fluck, baryton. Trio Metral: Joseph Metral, violon, Justine Metral violoncelle, Victor Metral, piano."
adresse: Salle d'orgue du Conservatoire National Supérieur de Musique, 229 avenue Jean Jaurès, 75019 Paris
commentaire:
  fr: "<p>L’association Olivier Greif organise chaque année au printemps un concert en hommage au compositeur. Cette année, c'est le Conservatoire National qui organise le concert avec le soutient de l'association, sous la houlette de deux personnes qui ont bien connu Olivier: Bruno Mantovani, directeur du Conservatoire, et Michel Dalberto, professeurs de piano. Les élèves de piano appartiennent aux classes de Michel Dalberto, Marie-Josèphe Jude, Claire Désert, et Denis Pascal; le baryton à la classe de Stephan Genz.</p>"
