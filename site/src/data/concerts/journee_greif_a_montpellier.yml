commentaire:
  fr: <p>Brigitte François-Sappey a consacré une conférence à Olivier dans l’auditorium du Conservatoire au cours de l’après-midi, en présence d’élèves de l’établissement. Jean-Jacques Greif a évoqué des souvenirs de son frère. </p>
