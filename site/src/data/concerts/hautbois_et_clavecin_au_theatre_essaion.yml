titre:
  fr: Hautbois et Clavecin au Théâtre Essaïon
date: 1977-02-07
oeuvres:
  - sonate_pour_hautbois_et_clavecin_ou_saxophone_alto_et_piano
interpretes:
  fr: Jacques Vandeville, hautbois et William Christie, clavecin.
adresse: Théâtre Essaïon, 75004 Paris
commentaire:
  fr: 'Création de l’œuvre. Le programme annonce: “Variations on Peter Philips Galiarda Dolorosa". Ce titre ayant été utilisé pour une œuvre ultérieure pour violon et piano, Olivier l’a remplacé sur le catalogue par “Sonate pour hautbois et clavecin”.'
