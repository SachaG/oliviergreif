titre:
  fr: Mildred et Olivier
date: 2010-12-21
oeuvres:
  - portraits_et_apparitions
interpretes:
  fr: Olivier Greif, piano.
adresse: France-Musique
commentaire:
  fr: <p>Du 20 au 24 décembre à 16h, Renaud Machart consacre l’émission “Grandes Figures” à Mildred Clary. La série est intitulée “La belle dame (avec regret)”. Le mardi 21, l’émission évoque l’amitié entre Mildred et Olivier. On entend le “Portrait de Mildred avec miroir” et la “Lettre à Olivier” lue par Mildred.</p>
