commentaire:
  fr: <p>Soirée d’ouverture des 17èmes Rencontres Musicales de La Prée, qui rendent un grand hommage à Olivier Greif, résident de l’abbaye de 1998 à sa mort.<br />Oeuvres de J.C. Bach, Liszt, Naoumoff et Chopin par Émile Naoumoff, L’oiseleur des Longchamps, Nicolas Dautricourt, Emmanuelle Bertrand, Pascal Amoyel.</p>
