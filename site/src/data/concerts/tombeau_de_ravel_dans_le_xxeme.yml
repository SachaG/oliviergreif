titre:
  fr: Tombeau de Ravel dans le XXème
date: 2024-11-17
oeuvres:
  - le_tombeau_de_ravel
interpretes:
  fr: Sandra Chamoux et Laurence Garcin, piano.
adresse: Les rendez-vous d'ailleurs, 109 rue des Haies, 75020 Paris
commentaire:
  fr: <p>À 18h, Sandra Chamoux jouera <em>Éphémères</em> de Philippe Hersant. À 19h, Philippe Hersant et Graziane Finzi parleront de leurs œuvres (et sans doute d'Olivier Greif, qu'ils ont bien connu tous les deux). À 20h, les deux pianistes joueront <em>Le tombeau de Ravel</em> et des œuvres à quatre mains de Philippe Hersant, Graziane Finzi et Maurice Ravel. </p>
