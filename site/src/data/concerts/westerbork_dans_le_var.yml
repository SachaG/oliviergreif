titre:
  fr: Westerbork dans le Var
date: 2017-08-26
oeuvres:
  - lettres_de_westerbork
interpretes:
  fr: Fiona McGown, mezzo-soprano; Hélène Maréchaux et Olivia Hugues, violon.
adresse: Espace culturel René-Marcel, Entrecasteaux, 83570
commentaire:
  fr: <p>Œuvres de Brahms. <br />Le directeur artistique du festival d'Entrecasteaux, le violoncelliste Alain Meunier, a rencontré Olivier en 1980 et à la fin de sa vie. Voici ce qu’Olivier écrit dans son journal en 1999:  <br />“Alain Meunier m’a rapporté que l’année – ce devait être au début de la décennie 80 – où il est venu donner des cours dans le cadre de l’Académie d’Annecy (où j’enseignais moi-même), nous avons joué ensemble les cinq sonates de Beethoven. En privé, pour notre propre plaisir. Il me confie avoir alors perçu dans la partie de piano des choses qu’il n’a jamais entendues ailleurs depuis, chez aucun interprète, et s’en souvenir aujourd’hui encore comme si c’était hier. <em>Une certaine façon qu’a un compositeur de restituer tout en jouant la structure profonde de l’œuvre, sa pensée même</em>, observe-t-il.”</p>
