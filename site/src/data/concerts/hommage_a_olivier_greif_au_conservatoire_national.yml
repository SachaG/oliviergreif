titre:
  fr: Hommage à Olivier Greif au Conservatoire National
date: 2021-10-14
oeuvres:
  - les_chants_de_l_ame
  - light_music
  - rondo_pour_piano_42nd_street
  - sonate_n_15_de_guerre
  - le_tombeau_de_ravel
  - trio
interpretes:
  fr: Philippe Hattat, Adrienne Dubois, Géraldine Dutroncy, Lucas Belkhiri, Héloïse Bertrand-Oleari, Ionah Maïatsky, piano.Solène Laurent, mezzo-soprano – Olivier Cesarini, baryton.Aï Nakano violon – Clara Dietlin, violoncelle.
adresse: CNSMDP, 209 av. Jean-Jaurès, 75019 Paris
commentaire:
  fr: "<p>Certains des interprètes sont des élèves des classes de Marie-Josèphe Jude, Anne Le Bozec, Alexis Galpérine, Géraldine Dutroncy, Roland Daugareil, Michel Strauss. Certaines œuvres ne seront pas données intégralement.<br />La journée commencera à 14h. <br />De 14h à 17h, un colloque mené par Claude Abromont comportera les interventions suivantes:<br /><span>Brigitte François-Sappey, musicologue,</span><em> Olivier Greif : un parcours singulier enraciné au Conservatoire de Paris.<br /></em>Jean-François Heisser, pianiste et chef d’orchestre, <em>Olivier Greif, pianiste et compositeur précoce d’après des enregistrements inédits.<br /></em>François-Gildas Tual, université de Franche-Comté, <em>Olivier Greif : par \"envide\" et \"génie\" de l'enfance.<br /></em>Félix Bénati, lauréat CNSMDP, <em>Requiem pour double chœur a cappella d’Olivier Greif</em>.<br />Sarah Léon, lauréate CNSMDP, <em>Ich ruf zu dir d'Olivier Greif : une esthétique du tragique.</em><br />De 17h30 à 18h30, une table ronde menée par Brigitte François-Sappey réunira <span>Marc Minkowski, Philippe Hersant, Karol Beffa Alexis Galpérine.</span></p>"
