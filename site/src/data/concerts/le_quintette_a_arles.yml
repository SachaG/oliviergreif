titre:
  fr: Le Quintette à Arles
date: 1997-05-23
oeuvres:
  - quintette_pour_piano_et_cordes_a_tale_of_the_world
interpretes:
  fr: Florent Boffard, piano et le quatuor Sibelius
adresse: St-Martin du Méjan,  Arles
commentaire:
  fr: <p>Olivier raconte dans son journal que le tourneur de pages, peu habitué à cet exercice, a tourné deux pages à la fois. Le pianiste, qui ne connaissait pas le quintette aussi bien que Jean-François Heisser, a continué sans rien remarquer. Le quatuor a suivi comme il a pu, sauf le violoncelliste, qui n’a pas réussi à s’y retrouver et a improvisé jusqu’à la fin de l’œuvre. Le public ne s’est aperçu de rien.  </p>
