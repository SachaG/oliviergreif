commentaire:
  fr: <p>Stéphane Goldet invite l’ensemble Syntonia pour une nouvelle émission, “Plaisirs du quatuor”, diffusée le dimanche de 15h30 à 17h. L’enregistrement public de l’émission aura lieu à la maison de Radio France le 28 octobre pour une diffusion en novembre. Syntonia interprètera le quatuor “Ulysses".</p>
