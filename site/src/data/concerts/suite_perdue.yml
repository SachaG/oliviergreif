titre:
  fr: Suite perdue
date: 1962-05-23
interpretes:
  fr: Olivier Greif
adresse: Conservatoire d’Art Dramatique, 75009 Paris
commentaire:
  fr: Concert consacré aux œuvres dédiées à Mme Lucette Descaves. Marièle Labèque joue Damasse, Katia Labèque joue Revel, Pascal Rogé joue Gallon et Dutilleux, etc. Olivier joue une Suite perdue, mais mentionnée dans son catalogue (ainsi qu’une œuvre à deux pianos de A. Massis, avec Béatrice Hindley).
