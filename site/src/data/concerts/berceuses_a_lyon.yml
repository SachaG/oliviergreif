commentaire:
  fr: <p>Deux berceuses du Piano Book op. 78, <em>Berceuse</em> op. 78-02 et <em>Berceuse de la nuit des îles</em> op. 78-21, ont été données dans un récital de berceuses par une douzaine de compositeurs, de Brahms à Gershwin.</p>
