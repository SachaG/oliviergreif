commentaire:
  fr: "<p>Seul un mouvement de la sonate est joué, parmi des œuvres de Liszt, Chopin, Schumann, Scriabine, Katachaturian, Gerschwin, Duke Ellington et Pascal Amoyel.<br />Ce spectacle est donné presque tous les soirs à 20h, ainsi que les week-ends à 17h, depuis le 28 septembre et jusqu'au 31 décembre.<br />Détails et dates: <a href=\"https://arts-scene.be/fr/asd-artistes-programmes-Pascal-Amoyel-545\" title=\"https://arts-scene.be/fr/asd-artistes-programmes-Pascal-Amoyel-545\" target=\"_blank\">https://arts-scene.be/fr/asd-artistes-programmes-Pascal-Amoyel-545<br /></a>Réservation en ligne : <a href=\"https://billetterie-theatre-montparnasse.tickandlive.com/\" target=\"_blank\">https://billetterie-theatre-montparnasse.tickandlive.com/<br />O</a>u par téléphone: 01 43 22 77 74</p>"
