commentaire:
  fr: <p>A tragic football game est une pièce très brève composée en 1993. Elle s’insère dans un récital “autour de Satie”, avec des œuvres de E. Satie, C. Debussy, M. Ravel, V. d’Indy, F. Poulenc.</p>
