titre:
  fr: Hommage à Olivier Greif au CNR
date: 2007-10-06
oeuvres:
  - night_without_sleep
  - quatuor_n_3_todesfuge
  - sonate_pour_piano_n_22_les_plaisirs_de_cherence
interpretes:
  fr: Sung Eon Yun, baryton, et Hiromi Kitayama, piano. Sung Eon Yun, baryton – Sébastien Richaud, violon – Young Eun Ko, violon – Julien Dabonneville, alto - Clémentine Meyer, violoncelle. Pascal Amoyel, piano.
adresse: CNR 14 Rue de Madrid, 75008 Paris.
commentaire:
  fr: "<p>La soirée s’inscrivait dans le cadre de la Nuit Blanche de la Musique. Elle comportait une conférence: “Portrait et apparitions, un destin en images”, par Brigitte François-Sappey. Pascal Amoyel a joué la Sonate à 20h, 21h, 22h, 23h et 24h.</p>"
