commentaire:
  fr: <p>Premier concert de l’association Cantus Formus, fondée par Nicolas Bacri. Œuvres de Nicolas Bacri, Karol Beffa, Jacques Boisgallais. La sonate a été donnée par les mêmes interprètes les 16 janvier et 18 février à Libreville et Port Gentil (Gabon).</p>
