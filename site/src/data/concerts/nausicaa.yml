titre:
  fr: Nausicaa
date: 1959-07-02
interpretes:
  fr: Olivier Greif
adresse: Salle Berlioz, CNSM, 14 rue de Madrid, 75008 Paris
commentaire:
  fr: "<p>Audition annuelle des élèves privés de Mme Descaves. Seul de tous les élèves, Olivier joue une de ses propres œuvres, Nausicaa (ainsi qu’une Bagatelle de Beethoven et Golliwog’s Cakewalk, de Debussy). Il a perdu ou jeté Nausicaa, mails il mentionne cette première œuvre dans son catalogue. Un autre futur compositeur participait à cette audition : Philippe Hersant.</p>"
