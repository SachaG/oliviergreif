titre:
  fr: Berceuses à Grenoble
date: 2022-02-04
interpretes:
  fr: Anne Ibos-Augé, docteure en musicologie, chercheuse à l’IReMus.
adresse: Université Grenoble Alpes, Grande salle des colloques Stendhal 4e étage bâtiment G. 1180 Avenue Central-Domaine universitaire
commentaire:
  fr: "<p>Anne Ibos-Augé donne une conférence intitulée <span><em>Les berceuses dans la musique d’Olivier Greif : un discours narratif de l’enfance</em> </span>dans le cadre du colloque “<em>Berceuses, histoire(s) et conscience”</em> qui se déroule à l'Université de Grenobles les 3 et 4 février.</p>"
