date: 2011-04-21
oeuvres:
  - trio
interpretes:
  fr: Divers trios
adresse: Salle Molière, 18 quai de Bondy, 69005 Lyon
commentaire:
  fr: <p>Demi-finale du concours international de musique de chambre de Lyon. Le 3ème et 4ème mouvement du Trio d’Olivier Greif sont imposés. Epreuve publique, entrée libre.<br />Un colloque musicologique portant sur l'histoire et les perspectives du trio avec piano a lieu le même jour, à partir de 10h, avec la participation de Brigitte François-Sappey et Benoît Menut (membres du conseil d’admisnitration de l’associaton Olivier Greif). Salle Witkowski, même adresse.</p>
