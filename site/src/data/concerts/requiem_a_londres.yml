titre:
  fr: Requiem à Londres
date: 2012-06-03
oeuvres:
  - requiem
interpretes:
  fr: St James choir.
adresse: Église St James Garlickhythe, City of London
commentaire:
  fr: <p>Huit nouvelles cloches ont été fondues à l’occasion du jubilé de la Reine. Le Sanctus du Requiem, qui comporte la comptine “Oranges and lemons, say the bells of Saint Clement’s”, sera chanté pour célébrer les nouvelles cloches. Dans l’après-midi, les cloches sonneront sur la barge de tête d’une flotille de mille bateaux qui voguera sur la Tamise pour le <span>“Queen's Diamond Jubilee River Pageant”</span>.</p>
