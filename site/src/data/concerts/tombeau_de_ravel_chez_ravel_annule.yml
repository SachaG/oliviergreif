titre:
  fr: Tombeau de Ravel chez Ravel – Annulé
date: 2020-10-03
oeuvres:
  - le_tombeau_de_ravel
interpretes:
  fr: Florence Jacquin-Ribot et Laurence Rigault, piano.
adresse: Montfort l'Amaury, 78490.
commentaire:
  fr: <p>Journées Ravel de Montfort l’Amaury (qui ont commandé la partition à Olivier en 1975). La journée se déroule selon le principe des Prom’s de Londres. Il y a trois lieux de concert. Le public se promène d’un lieu à l’autre. Les deux pianistes vont donc rester au même endroit et jouer le <em>Tombeau de Ravel</em> trois fois. Les lieux de l’an dernier sont indiqués sur le site lesjourneesravel.com, qui sera mis à jour en temps utile.</p>
