titre:
  fr: Trio de Benoît Menut à la mémoire d’Olivier Greif
date: 2008-06-22
interpretes:
  fr: "Trio Schubert: Nathanaëlle Marie, violon - Christophe Beau, violoncelle - Carine Zarifian, piano."
adresse: La Prée, 36100 Ségry.
commentaire:
  fr: <p>Création du trio de Benoît Menut à la mémoire d’Olivier Greif - Benoît Menut est compositeur en résidence à l’abbaye de La Prée, comme l’était Olivier Greif. Cette œuvre est une commande de Thierry Ansieau.</p>
