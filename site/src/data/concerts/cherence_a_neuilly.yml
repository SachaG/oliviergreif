commentaire:
  fr: <p>Emmanuelle Bertrand jouera Sadhana, une œuvre pour violoncelle seul composée par Pascal Amoyel à la mémoire d'Olivier Greif.<br />Ce concert accompagne la sortie chez Triton d'un disque comportant La Sonate de Guerre, Sadhana et la Sonate Les Plaisirs de Chérence.</p>
