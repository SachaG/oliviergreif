titre:
  fr: Codex Domini à Grenoble
date: 2022-05-08
oeuvres:
  - sonate_pour_piano_n_21_codex_domini
interpretes:
  fr: Laurence Garcin et Florence Cioccolani, piano.
adresse: Musée en musique, place de Lavalette, 38 000 Grenoble
commentaire:
  fr: <p>Les deux pianistes jouent des œuvres à quatre mains de Crumb, Boucourechliev, Ligeti et Pärt. Laurence Garcin joue le premier mouvement de la sonate <em>Codex Domini</em>.<br />À 17h30, Nicolas Horvath, qui connait bien la musique d’Oivier pour l'avoir souvent jouée en concert, donnera des œuvres de Philip Glass, Steve Reich, Alvin Lucier et Terry Riley.</p>
