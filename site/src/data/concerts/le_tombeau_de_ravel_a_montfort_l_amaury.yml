titre:
  fr: Le Tombeau de Ravel à Montfort L’Amaury
date: 1975-05-24
oeuvres:
  - le_tombeau_de_ravel
interpretes:
  fr: Henri Barda et Olivier Greif
adresse: Centre des Loisirs de Montfort L’Amaury
commentaire:
  fr: Commande de Siao Ping Fan (ou Fan Xiaoping) pour le festival Ravel de Montfort L’Amaury. Création de l’œuvre, dans le cadre d’une conférence “Ravel et les compositeurs d’aujourd’hui” donnée par Alain Kremski et Olivier. Kremski a aussi composé une œuvre en hommage à Ravel, “Un Paysage Serein” pour cloches anciennes d’Iran et gongs.
