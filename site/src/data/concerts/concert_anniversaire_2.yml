adresse: Reid Hall, 4 rue de Chevreuse, 75006 Paris
commentaire:
  fr: "<p>Dix-septième anniversaire de la mort d’Olivier. Concert organisé par l’association Olivier Greif. L’entrée est gratuite pour les membres de l’association. <br />Pour les non-membres: on peut acheter des billets à partir de 19h dans la librairie Tschann Jeunesse, 125 bd du Montparnasse (au coin de la rue de Cheveruse). 22euros, 16 euros pour étudiants et chômeurs, gratuit en-dessous de 12 ans. <br />Prévente dans la librairie musicale Falado, 6 rue Léopold Robert 75014 et chez Mi-Fugue Mi-Raisin, vins et disques, 36/38 rue Delambre 75014.</p>"
