commentaire:
  fr: <p>Seuls les portraits III et I seront donnés. Œuvres de Beethoven, Schumann, Pintscher et Neuwirth. Andrew Zhou a remporté le prix Olivier Greif au concours de piano d’Orléans 2012.<br />Concert organisé en partenariat avec le concours d’Orléans et avec le soutien de l’association Olivier Greif. Le récital sera suivi d’un déjeuner.</p>
