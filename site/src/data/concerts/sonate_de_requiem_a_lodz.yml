titre:
  fr: Sonate de Requiem à Lodz
date: 2014-11-18
oeuvres:
  - sonate_de_requiem
  - veni_creator
interpretes:
  fr: Anna Sawicka, violoncelle et Anna Mikolon, piano
adresse: Académie de musique, Lodz, Pologne
commentaire:
  fr: <p>Dans le cadre d’une semaine de concerts et de conférences consacrés à la musique de chambre française. Des œuvres de Louise Farrenc, Cécile Chaminade et Claude Debussy (jouées par d’autres interprètes) complètent le concert. La pianiste Anna Mikolon a donné une conférence intitulée “Synthèse des idées musicales médiévales et contemporaines dans le <em>Veni Creator</em> et la <em>Sonate de Requiem</em> d’Olivier Greif.”</p>
