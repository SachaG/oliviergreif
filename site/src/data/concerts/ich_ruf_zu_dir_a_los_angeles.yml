titre:
  fr: Ich ruf zu dir à Los Angeles
date: 2006-03-14
oeuvres:
  - ich_ruf_zu_dir
interpretes:
  fr: William Powell, clarinette, et cinq musiciens de l’institut CalArts.
adresse: Los Angeles, Walt Disney Concert Hall, RedCat theater.
commentaire:
  fr: <p>William Powell a connu Olivier en 1970 à Juilliard School. Il enseigne la clarinette à CalArts, une école d’art patronnée par la compagnie Walt Disney. Le théâtre  RedCat (Roy and Ethel Disney CalArts Theater) est la petite salle du Walt Disney Concert Hall, un bâtiment magnifique construit par Frank Gehry dans le même style que le musée Guggenheim de Bilbao.</p>
