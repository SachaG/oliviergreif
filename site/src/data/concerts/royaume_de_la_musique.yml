titre:
  fr: Royaume de la Musique
date: 1960-04-24
interpretes:
  fr: Olivier Greif
adresse: Théâtre des Champs-Élysées, 75008 Paris
commentaire:
  fr: <p>Concert des premiers prix des Tournois du Royaume de la Musique, créés par Sylvie Raynaud-Zurfluh. Olivier, “premier prix à neuf ans“, joue un Nocturne de Chopin.</p>
