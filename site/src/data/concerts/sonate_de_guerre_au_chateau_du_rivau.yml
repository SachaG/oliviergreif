commentaire:
  fr: <p>Le Liu est colauréate du prix Olivier Greif au concours de piano d’Orléans 2014.<br />Œuvres de Henri Dutilleux, Frank Martin, Zhang Zhao, Olivier Messiaen. Concert organisé par l’association Foyer Geneviève Joy - Henri Dutilleux. Entrée libre.<br />Le Liu a joué la sonate les 13 et 20 mars à Chinon.</p>
