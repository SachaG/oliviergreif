titre:
  fr: Agincourt à Dijon
date: 2010-09-18
oeuvres:
  - sonate_pour_2_violoncelles_the_battle_of_agincourt
  - les_chants_de_l_ame
interpretes:
  fr: Agnès Vesterman et Patrick Langot, violoncelles. Pierrette Grant, chant et Bruce Grant, piano. Stéphanie Moraly, violon et Romain David, piano.
adresse: Hôtel Maleteste , 7 rue Hernoux, 21000 Dijon, 03 80 30 47 11.
commentaire:
  fr: <p>Seuls deux des Chants de l’Âme seront donnés. Le programme piano/violon de Stéphanie Moraly et Romain David n’a pas encore été communiqué.<br />Alexandre Gasparov inteprétera une œuvre de sa composition en hommage à Olivier, des textes d’Olivier seront lus, le film d’Anne Bramard-Blagny sur Olivier sera projeté, des toiles d’Étienne Yver seront exposées, etc.<br />À minuit aura lieu une transmission par internet de l'inteprétation de Ich ruf zu dir à Los Angeles par William Powell et ses amis.</p>
