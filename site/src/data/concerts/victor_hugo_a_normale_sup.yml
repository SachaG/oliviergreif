titre:
  fr: Victor Hugo à Normale Sup
date: 2009-04-09
oeuvres:
  - table_des_matieres
interpretes:
  fr: L’Oiseleur des Longchamps, baryton et Juliette Regnaud, piano.
adresse: Ecole Normale Supérieure, Salle des Actes, 45 rue d’Ulm, 75005 Paris
commentaire:
  fr: <p>Au cours d’une soirée consacrée à Victor Hugo, L’Oiseleur des Longchamps chantera des mélodies de List, Bizet, Widor, Saint-Saens, Fauré. Il donnera en création Table des Matières op. 331, une mise en musique de titres de chapitres des Misérables traduits en latin. Cette oeuvre, composée en 1998, est la dernière à laquelle Olivier ait donné un numéro d'opus.<br />L’entrée est gratuite, mais il convient de réserver sa place en envoyant un e-mail à l’adresse ci-dessus.</p>
