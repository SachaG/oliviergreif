titre:
  fr: In Paradisum à Juilliard School
date: 1970-05-07
interpretes:
  fr: William Powell, clarinette – Marilyn Swindler, flûte– David Frost, percussions – Ultra Violet, voix – Olivier Greif, piano.
adresse: Juilliard School, New York
commentaire:
  fr: <p>Le programme annonce un “Drama Workshop à Juilliard School” et ”In Paradisum, a theatrical music by Olivier Greif”. Cette œuvre ne figure pas au catalogue. Olivier ne l’a sans doute jamais notée. Il en existe un enregistrement, dans lequel Olivier semble improviser longuement au piano. Selon William Powell, qui enseigne aujourd’hui la clarinette à l’école CalArts de Los Angeles (et qui a donné Ich Ruf zu Dir dans la petite salle du Walt Disney Concert Hall), c’est pour célébrer son prix de clarinette que ce concert a été monté.</p>
