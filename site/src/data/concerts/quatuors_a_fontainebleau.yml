titre:
  fr: Quatuors à Fontainebleau
date: 2010-06-05
oeuvres:
  - quatuor_n_3_todesfuge
  - quatuor_a_cordes_n_2_avec_voix
  - lettres_de_westerbork
interpretes:
  fr: Quatuor Voce et Ivan Geissler, baryton, pour le 3ème quatuor (à 18h).Quatuor Ardeo et Andrea Hill, mezzo-soprano, pour le 2ème quatuor et les Lettres de Westerbork (à 20h30).
adresse: Théâtre de Fontainebleau (face au château)
commentaire:
  fr: <p>À 17h, une table ronde “Hommage à Olivier Greif” réunira Brigitte François-Sappey, Jean-Michel Nectoux, Philippe Hersant et Gérard Condé.<br />Le concert de 18h comportera aussi le 11ème quatuor de Beethoven. Le concert de 20h30 comportera un poème lyrique pour voix et quatuor de Respighi et le 7ème quatuor de Beethoven.</p>
