titre:
  fr: Récital à Champéry
date: 1969-08-06
oeuvres:
  - sonate_n_3_pour_piano_quatre_soli_avec_fugue
interpretes:
  fr: Olivier Greif
adresse: Église de Champéry, Suisse
commentaire:
  fr: "Olivier a inteprété aussi la cinquième Suite Française de Bach, la Sonate en Si bémol majeur de Schubert (que le compte-rendu dans le journal local qualifie de “composition ardue, rarement interprétée – Schubert était encore presque inconnu) et les Variations de Brahms sur un thème de Haendel. Le programme donne à l’œuvre d’Olivier son nom d’origine: “Quatre soli pour piano”."
