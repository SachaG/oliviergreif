titre:
  fr: Cent Cinquantenaire de Chopin
date: 1960-05-23
interpretes:
  fr: Olivier Greif
adresse: Salle Gaveau, 75008 Paris
commentaire:
  fr: Concert d’œuvres inédites ou rares de Chopin par “les moins de 14 ans de l’École Marguerite Long, cours de Mme Lucette Descaves”, en présence de l’Ambassadeur de Pologne. Les interprètes sont des élèves privés de Mme Descaves, qui appartenaient peut-être à "L’École Marguerite Long” sans le savoir.
