titre:
  fr: Alouette au temple du Luxembourg
date: 2016-04-15
oeuvres:
  - quatre_poemes_de_j_prevert
interpretes:
  fr: L’oiseleur des Longchamps, baryton et Laurianne Corneille, piano.
adresse: Temple du Luxembourg, 58 rue Madame 75006 Paris
commentaire:
  fr: <p>L’oiseleur chantera <em>Sang et Plumes</em> (“L’alouette du souvenir”), une des <em>Quatre chansons de Jacques Prévert</em>, opus 2 d’Olivier, au cours d’un récital intitulé “Oiseaux en chantant”. Œuvres de Bizet, Brahms, Britten, Canteloube, Daquin, Rameau, Schubert, etc.</p>
