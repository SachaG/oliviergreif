titre:
  fr: Hommage à Olivier au festival de Cordes
date: 2001-07-24
oeuvres:
  - quadruple_concerto_la_danse_des_morts
  - trio
  - quatuor_n_4_ulysses
  - les_chants_de_l_ame
  - sonate_de_requiem
  - sonate_n_14_pour_piano_dans_le_gout_ancien
  - le_tombeau_de_ravel
  - ich_ruf_zu_dir
  - requiem
  - sonate_pour_violon_et_piano_n_3_the_meeting_of_the_waters
interpretes:
  fr: Sarah Nemtanu, violon, Lise Berthaud, alto, Alexander Gebert, violoncelle, Jonas Vitaud, piano et l’orchestre du festival dirigé par Jérémie Rohrer pour le Quadruple concerto.Daniel Garlitsky, Mathieu Godefroy, Lise Berthaud et Patrick Langot pour le Quatuor n°4 “Ulysses”.Nicolas Baldeyrou, clarinette, Sarah Nemtanu, violon, Jan Orawiec, violon, Vincent Debruyne, alto, Grégoire Korniluk, violoncelle, Jonas Vitaud, piano pour Ich ruf zu dir.Jonathan Bénichou, Jan Orawiecz et Dimitri Maslennikov pour le Trio.Renaud Capuçon et Bertrand Chamayou pour le Raga de la Sonate “Meeting of the Waters”.Jennifer Smith, soprano et Henri Barda, piano pour les Chants de l’âme.Jérôme Pernoo, violoncelle et Jérôme Ducros, piano pour la Sonate de Requiem.Alexandre Tharaud pour la Sonate dans le goût ancien.Jean-François Heisser et Marie-Josèphe Jude pour le Tombeau de Ravel.L’ensemble Stéphane Caillat pour des extraits du Requiem.
adresse: Cordes-sur-Ciel (Tarn)
commentaire:
  fr: |-
    <p>Le pianiste Xavier Bouchaud (12 ans) a joué des petites pièces (Troubadours et Ménestrels, Choral, portraits  de Henri Barda, Roger Godino, Joanne Margaret Büchting, Marilys Raoul-Duval), ainsi que les quelques lignes écrites par Olivier dans le train neuf jours avant sa mort.<br />
     Un colloque Olivier Greif a réuni Mildred Clary, Brigitte François-Sappey, Philippe Hersant et Jean-François Zygel.<br />
     L’Association Acadoc organise le festival de Cordes, dont Yves Petit de Voize est le directeur artistique.</p>
