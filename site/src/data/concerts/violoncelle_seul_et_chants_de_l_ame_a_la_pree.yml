titre:
  fr: Violoncelle seul et Chants de l’Âme à La Prée
date: 1996-05-16
oeuvres:
  - sonate_pour_2_violoncelles_the_battle_of_agincourt
  - les_chants_de_l_ame
interpretes:
  fr: Dominique de Williencourt, violoncelle.Jennifer Smith, soprano et Olivier Greif, piano.
adresse: Abbaye de La Prée, 36100 Ségry
commentaire:
  fr: |-
    <p>Troisièmes rencontres musicales de La Prée.<br />
     La sonate “Battle of Agincourt” n’est pas celle figurant au catalogue, mais la version initiale, pour un seul violoncelle. L’œuvre étant trop difficile, Olivier a ajouté un second violoncelle. La version définitive a été créée l’année suivante.
    </p>
