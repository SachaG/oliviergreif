titre:
  fr: Rêve du monde à Nice
date: 2023-10-28
oeuvres:
  - sonate_pour_piano_n_20_le_reve_du_monde
interpretes:
  fr: Jonathan Benichou, piano et Jessica Naïm, chant.
adresse: Chez Benattar, 19 rue Saint-François de Paule, Nice
commentaire:
  fr: <p>Concert-conférence <em>De la synesthésie au rêve sonore</em> en lien avec les idées de Scriabine.<br />Seuls le premier et le quatrième mouvement de la sonate ont été donnés. Œuvres de Liszt, Messiaen, Scriabine, Rimsky-Korsakov, Ravel.</p>
