  - sonate_de_requiem
interpretes:
  fr: Emmanuelle Bertrand, violoncelle et Pascal Amoyel, piano.
adresse: Münsterhof
commentaire:
  fr: <p>Dans le cadre du festival Musica, concert “programmé par le public”, en l’occurence le Dr Bernard Pfister, dermatologue et grand mélomane. Il a suggéré que l’on consacre des concerts aux “oubliés” du festival, à commencer par Olivier Greif, dont aucune œuvre n’a jamais été jouée à Musica. </p>
