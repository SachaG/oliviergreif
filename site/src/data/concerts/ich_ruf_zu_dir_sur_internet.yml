commentaire:
  fr: <p>En principe, ce concert sera transmis en direct par internet à l'Hôtel Maleteste à Dijon dans le cadre de la journée d’hommage à Olivier. Sa disponibilité ultérieure sur le site ci-dessus n’est pas confirmée.</p>
