date: 2010-09-18
oeuvres:
  - ich_ruf_zu_dir
interpretes:
  fr: Lorna Eder, piano; William Powell, clarinette; Mark Menzies, violon I; Mona Jeon Tian, violon II; Andrew MacIntosh, alto; Erika Duke-Kirkpatrick, violoncelle.
