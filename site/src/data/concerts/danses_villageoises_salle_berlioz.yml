titre:
  fr: Danses Villageoises salle Berlioz
date: 1960-06-24
interpretes:
  fr: Olivier Greif
adresse: Salle Berlioz, CNSM, 14 rue de Madrid, 75008 Paris
commentaire:
  fr: <p>Audition annuelle des élèves privés de Lucette Descaves. De nouveau, Olivier est le seul à intepréter une de ses propres œuvres, “Danses Villageoises”, malheureusement perdue.</p>
