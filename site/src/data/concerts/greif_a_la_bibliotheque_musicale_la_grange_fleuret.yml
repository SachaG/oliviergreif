date: 2021-10-01
oeuvres:
  - les_chants_de_l_ame
  - in_memoriam
interpretes:
  fr: Marie Laure Garnier, soprano - Philippe Hattat, piano.
adresse: Bibliothèque musicale La Grange-Fleuret (anciennement Médiathèque Musicale Mahler) 11bis rue de Vézelay 75008 Paris
commentaire:
  fr: "<p>Le concert couronne une journée d’étude “Présence d’Olivier Greif” coproduite par la bibliothèque et l’association Olivier Greif.<br />10h-10h15 – Thomas Vernet (Responsable du département des Bibliothèques et ressources à la BLGF) : Introduction<span> <br /></span>10h20-11h – Brigitte François-Sappey : Olivier Greif, « l’éclat, la douleur et le nom »<span> <br /></span>11h10-11h40 – Sarah Léon : Olivier Greif et la postmodernité <span> <br /></span>12h10-12h40 – Anne Ibos-Augé : Olivier/Haridas Greif, de la spiritualité avant toute chose<span> <br /></span>14h-14h30 – Etienne Kippelen : La chanson dans l’oeuvre d’Olivier Greif<span> <br /></span><span class=\"s2\">14h40-15h10 – Brice Tissier : </span>Durch Adams Fall : du Concerto pour violoncelle d'Olivier Greif à Nostalgia de Philippe Hersant<span> <br /></span>15h20-15h40 pause<span> <br /></span>15h40-16h10 – Benoit Menut : Olivier Greif : une écriture des obsessions<span> <br /></span>16h20-17h – Jean-Jacques Greif, Patricia Aubertin, Anne-Elise Thouvenin : Les archives d’Olivier Greif : transmission, valorisation – conversation animée par Thomas Vernet<span> <br /></span>17h-18h – visite libre du fonds Olivier Greif<span> </span></p>"
