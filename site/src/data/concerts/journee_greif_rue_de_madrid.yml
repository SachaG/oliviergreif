commentaire:
  fr: "<p>La journée Olivier Greif comportera les événements suivants:<br /><em>au 11bis, rue de Vézelay, 75008 Pari</em>s<br />10h-12h <span>Visite de la Bibliothèque musicale La Grange-Fleuret (anciennement Médiathèque musicale </span>Mahler) et présentation du nouveau fonds Olivier Greif par Anne-Élise Thouvenin<br /><em>au CRR, 14 rue de Madrid</em><br />14h-16h <span>« Le langage musical d’Olivier Greif : obsessions, citations, formes », atelier par Benoît Menut, </span>compositeur | Salle Fauré<br />16h-16h45 <span>Visite de l’exposition d’Étienne Yver avec le peintre lui-même, proche d’Olivier Greif | Hall du </span>CRR<br />17h-18h30 <span>Projection de « Nuits, démêlées », film documentaire (59’) sur Olivier Greif d’ABB Reportages</span> | Auditorium Marcel Landowski<br />19h-20h30 Concert</p>"
