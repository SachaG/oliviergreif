titre:
  fr: Portraits et Apparitions au Sudden Theatre
date: 2000-05-23
oeuvres:
  - portraits_et_apparitions
interpretes:
  fr: Olivier Greif, piano.
adresse: Sudden Theatre, 14 bis rue Sainte Isaure 75018 Paris
commentaire:
  fr: "<p>Diffusion de l’enregistrement de l’œuvre pour accompagner un ballet donné dix jours aprè sla mort d’Olivier: “L’Amertume de la Salade rend les Escargots mélancoliques”, scénographié par Étienne Yver et chorégraphié par Viktor Pêche. Olivier avait autorisé cette utilisation de son œuvre.</p>"
