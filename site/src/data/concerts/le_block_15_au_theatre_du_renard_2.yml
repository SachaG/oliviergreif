titre:
  fr: Le Block 15 au théâtre du Renard
date: 2007-11-20
oeuvres:
  - sonate_de_requiem
  - sonate_n_15_de_guerre
interpretes:
  fr: Emmanuelle Bertrand, violoncelle et Pascal Amoyel, piano.
adresse: Théâtre du Renard, 12 rue du Renard, 75004 Paris.
commentaire:
  fr: |-
    <p>Le Block 15 est un spectacle sur la musique à Auschwitz. Il comporte des œuvres de plusieurs compositeurs, dont Olivier Greif. Dix-neuf représentations ont été données, du 20 novembre au 14 décembre.
     </p>
