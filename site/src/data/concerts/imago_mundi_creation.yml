titre:
  fr: Imago Mundi, création
date: 2016-05-18
oeuvres:
  - imago_mundi
  - symphonie_version_voix_et_orgue
interpretes:
  fr: Loiseleur des Longchamps, baryton, Olivier Dekeister, orgue, Philippe Hattat, piano.
adresse: Église Saint Lambert de Vaugirard, 2 rue Gerbert 75015 Paris
commentaire:
  fr: <p>Concert anniversaire organisé par l’association Olivier Greif.<br />Les six premiers poèmes du cyle <em>imago Mundi</em> ont été gravés et seront interprétés. Les manuscrits des trois derniers poèmes (dont un en yiddish et un en hébreu) sont difficiles à lire ou inachevés.</p>
