titre:
  fr: Chérence au Ranelagh
date: 2011-11-23
oeuvres:
  - sonate_pour_piano_n_22_les_plaisirs_de_cherence
interpretes:
  fr: Pascal Amoyel, piano
adresse: Théâtre du Ranelagh, 5 rue des Vignes 75016 Paris
commentaire:
  fr: <p>Pascal Amoyel interprète le Carillon de Chérence, ciquième mouvement de la sonate, dans le cadre de son spectacle "Le pianiste aux 50 doigts ou l'incroyable destinée de György Cziffra". <br />Le spectacle est donné du mercredi au samedi à 21h et le dimanche à 17h30 jusqu'au 31 décembre, ainsi que le 29 novembre à Montélimar et le 7 décembre aux Ulis.</p>
