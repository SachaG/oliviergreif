titre:
  fr: Am Grabe Franz Liszts sur France Musique
date: 1993-12-06
oeuvres:
  - am_grabe_franz_liszts
interpretes:
  fr: Olivier Greif
adresse: France Musique
commentaire:
  fr: <p>L’émission “Les mots et les notes” a été consacrée par Brigitte François-Sappey (pendant une semaine, de 9h 11h) à “La sonate de Liszt dans l’Europe musicale”. Olivier, présent comme interlocuteur et interprète d’extraits musicaux, a créé ce tombeau de Liszt. </p>
