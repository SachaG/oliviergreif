titre:
  fr: Plaisirs de Chérence à Orléans
date: 2017-03-23
oeuvres:
  - sonate_pour_piano_n_22_les_plaisirs_de_cherence
interpretes:
  fr: Tae Kim, piano, lauréat du dernier concours international de piano d’Orléans.
adresse: Salle de l’Institut, Orléans.
commentaire:
  fr: <p>Le concert est intitulé <em>Take a walk on the Wild Side</em>, titre d’une chanson de Lou Reed citée dans la sonate <em>Les plaisirs de Chérence</em>. Tae Kim jouera aussi la chanson de Lou Reed. Œuvres de R. Schumann, E. Denisov, P. Glass.</p>
