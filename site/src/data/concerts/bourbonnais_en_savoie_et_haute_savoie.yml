titre:
  fr: Bourbonnais en Savoie et Haute-Savoie
date: 2015-03-05
oeuvres:
  - quatuor_n_4_ulysses
interpretes:
  fr: Quatuor à cordes de l’Orchestre des Pays de Savoie
adresse: Le 5 mars à l’hôpital d’Annecy, le 12 au lycée Vaugelas de Chambéry, le 23 et le 26 au collège de la vallée d’Arve.
commentaire:
  fr: <p>Concerts d’action culturelle. Seul le quatrième mouvement du quatuor, “Bourbonnais”, sera donné. Œuvres de Mozart, Mendelssohn, Ravel, Bridge.</p>
