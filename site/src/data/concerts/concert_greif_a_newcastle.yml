titre:
  fr: Concert Greif à Newcastle
date: 2019-01-24
oeuvres:
  - sonate_pour_2_violoncelles_the_battle_of_agincourt
  - quatuor_n_3_todesfuge
  - lettres_de_westerbork
interpretes:
  fr: Natalie Clein et Liubov Ulybysheva, violoncelle; Simon Wallfisch, baryton; Alexandra Raikhlina et Daniel Garlitsky, violon; Sarah Castle, mezzo-soprano; Bell Quartet.
adresse: Brunswick Methodist Church,  Brunswick Pl, Newcastle upon Tyne NE1 7BJ, Royaume-Uni
commentaire:
  fr: <p>Alexandra Raikhlina a fondé en 2016 à Newcastle le <em>Brundibar Arts Festival</em>, consacré aux musiques de la Shoah. Le nom du festival se réfère à un opéra pour enfants du compositeur tchèque Hans Krása, donné par des musiciens et des enfants dans le ghetto modèle de Theresienstadt et filmé par la propagande nazie la veille de la déportation à Auschwitz et du gazage de toute la troupe. <br />Une conférence de Jean-Jacques Greif sur la manière dont la Shoah a affecté les survivants et la génération suivante, à laquelle appartient Olivier Greif, a précédé le concert.</p>
