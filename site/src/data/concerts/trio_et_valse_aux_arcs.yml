titre:
  fr: Trio et valse aux Arcs
date: 2020-07-26
oeuvres:
  - trio
  - valse_sur_le_nom_de_godino
interpretes:
  fr: Trio Metral et Michel Dalberto, piano.
adresse: Les Arcs, 73700 Bourg-Saint-Maurice
commentaire:
  fr: <p>47ème festival des Arcs. Hommage à Roger Godino, fondateur de la station des Arcs (et de l'Insead, etc.), mort en septembre 2019. Olivier, qui a été directeur artistique du festival, connaissait bien Roger Godino et lui a dédié une petite valse écrite sur les lettres de son nom.</p>
