titre:
  fr: Sonate de Requiem à Saint-Dié
date: 2025-04-06
oeuvres:
  - sonate_de_requiem
interpretes:
  fr: Emmanuelle Bertrand, violoncelle et Pascal Amoyel, piano.
adresse: Espace George-Sadoul, Saint-Dié les Vosges.
commentaire:
  fr: <p>Un extrait de la Sonate de Requiem est donné, ainsi que de nombreuses autres œuvres, au cours d'un spectacle musical intitulé <em>Le Block 15</em>, qui raconte le séjour à Auschwitz de la violoncelliste Anita Lasker-Wallfisch, membre de l'orchestre féminin du camp, âgée aujourd'hui de 99 ans. Le petit-fils de celle-ci, Simon Wallfisch, violoncelliste lui-même et baryton, a chanté Les Lettres de Westerbork dans un concert Olivier Greif donné le 24 janvier 2019 à Newcastle.</p>
