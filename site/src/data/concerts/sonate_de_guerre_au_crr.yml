commentaire:
  fr: <p>Aline Piboule, lauréate du prix Olivier Greif au concours de piano d'Orléans 2014, joue le premier mouvement de la Sonate de Guerre ainsi que des œuvres de Combier, Hersant et Dutilleux. Deux autres lauréats du concours participent au concert.</p>
