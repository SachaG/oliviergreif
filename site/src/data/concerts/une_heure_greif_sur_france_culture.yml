titre:
  fr: Une heure Greif sur France-Culture
date: 2010-06-11
oeuvres:
  - sonate_pour_2_violoncelles_the_battle_of_agincourt
  - sonate_pour_violon_et_piano_n_3_the_meeting_of_the_waters
interpretes:
  fr: Agnès Vesterman et Patrick Langot, violoncelles, Stéphanie Moraly, violon, et Romain David, piano.
adresse: France-Culture
commentaire:
  fr: <p>Pour son émission “Les vendredis de la musique” (de 15h à 16h), Jeanne-Martine Vacher a invité Brigitte François-Sappey, Gilles Cantagrel, Jean-Jacques Greif et quatre interprètes à parler d’Olivier. Des extraits d’œuvres seront donnés en direct. On entendra aussi des enregistrements d’œuvres et d’émissions auxquelles Olivier a participé.<br />On peut écouter et télécharger l’émission sur le site de France-Culture.</p>
