commentaire:
  fr: "<p>La soirée commence par le documentaire “Hommage à Olivier Greif” de Anne Bramard-Blagny, diffusé le 10 mai à la Sacem et le 15 mai à La Prée. On verra et entendra ensuite quatre concerts: ceux des 18 et 19 septembre 2009, 21 novembre 2009, 22 décembre 2008.<br />Rediffusion le 29 mai à 17h30 et le 5 juin à 11h.</p>"
