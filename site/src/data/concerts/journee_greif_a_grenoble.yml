titre:
  fr: Journée Greif à Grenoble
date: 2018-05-03
oeuvres:
  - cinq_chansons_enfantines
  - piano_book
  - wiener_konzert
interpretes:
  fr: Nathanaël Grosz et Olivia Grasset, élèves au Conservatoire, chant. Claire Blanchon, Morgane Baudry, Olga Rouchouze, Loup-Guillaume Tual, élèves au Conservatoire, piano.
adresse: Salle Messiaen, Conservatoire de Grenoble
commentaire:
  fr: <p><span>Une “Rencontre musicale avec Brigitte François-Sappey” s'est déroulée de 14h30 à 18h. Musicologue, amie proche d’Olivier Greif, dédicataire des </span><span>Chants de l'âme</span><span>, Brigitte François-Sappey a parlé de la vie et de l’œuvre d’Olivier Greif. Des élèves du Conservatoire ont proposé des illustrations musicales – tirées du </span><span>Piano Book</span><span> op. 78 [</span><em><em>Tango</em> (1965), <em>Courante</em> (1967), <em>Choral I</em> et <em>Choral II</em> (1968), <em>The Fierce Rabbit</em> (1971), <em>The Best Buy</em> (1971), <em>Fare thee well </em>(1972), <em>Sentiment caché</em> (1976)</em>].et du cycle de Lieder <span>Wiener Konzert</span><span> – et donné des exposés sur les </span><span>Quatre chansons de Prévert</span><span>, les </span><span>Lettres de Westerbork</span><span>, le </span><span>Requiem</span><span>, ainsi que “Olivier Greif en ses manuscrits” et “Les harmonies de l’âme”.</span></p>
