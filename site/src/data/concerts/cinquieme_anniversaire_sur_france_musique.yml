titre:
  fr: Cinquième anniversaire sur France Musique
date: 2005-05-10
interpretes:
  fr: ""
adresse: France Musique
commentaire:
  fr: "<p>À l’occasion du cinquième anniversaire de la mort d’Olivier, diffusion d’extraits d’œuvres le 10 mai dans l’émission de François Hudry  “La discothèque de l’honnête homme” et le 11 mai dans l’émission de Lionel Esparza “Si loin, si proche” (invitée: Brigitte François-Sappey). </p>"
